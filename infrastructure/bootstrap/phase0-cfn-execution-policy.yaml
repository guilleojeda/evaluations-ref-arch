    Value:
      Ref: IncidentTriageDemoControllerCfnExecution
  Phase3PolicyArn:
    Description: Managed policy ARN for the Phase 3 alarm and evidence bucket grants.
    Value:
      Ref: IncidentTriageDemoPhase3CfnExecution

  AgentPolicyArn:
    Description: Scoped agent stack execution policy.
    Value:
      Ref: IncidentTriageDemoAgentCfnExecution
