AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Scoped CloudFormation execution and runtime boundary policies for the
  Incident Triage Demo app and controller stacks.

Parameters:
  AppHttpApiId:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|[A-Za-z0-9_-]+)$'
    Description: >-
      Existing app HTTP API ID for post-create tightening; leave '*' only for
      the first app stack create.
  AppDistributionId:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|[A-Za-z0-9_-]+)$'
    Description: >-
      Existing app CloudFront distribution ID for post-create tightening.
  AppOriginAccessControlId:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|[A-Za-z0-9_-]+)$'
    Description: >-
      Existing app CloudFront OAC ID for post-create tightening.
  ControllerHttpApiId:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|[A-Za-z0-9_-]+)$'
    Description: >-
      Existing controller HTTP API ID for post-create tightening.

Resources:
  IncidentTriageDemoBootstrapCfnExecution:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoBootstrapCfnExecution
      Description: >-
        Phase 0 inspection permissions for the Incident Triage Demo CDK
        CloudFormation execution role. Extend this policy with reviewed,
        resource-scoped service grants before deploying a product stack.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InspectDemoStacks
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource: arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoBootstrap/*

          - Sid: ReadBootstrapVersionMarker
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: arn:aws:ssm:us-east-1:027224425948:parameter/cdk-bootstrap/evaltalk/version

          - Sid: ReadCdkLambdaAssets
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*

          - Sid: ManageAppTables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:Describe*
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UpdateTable
            Resource:
              - arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoOrders
              - arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoInventory

          - Sid: ManageAppLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource:
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoCheckout
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoCheckout:*
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoInventory
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoInventory:*
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/apigateway/IncidentTriageDemoApp
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/apigateway/IncidentTriageDemoApp:*

          # HTTP API access-log delivery uses the regional Logs delivery APIs;
          # these APIs currently require Resource '*'.
          - Sid: ConfigureHttpApiLogDelivery
            Effect: Allow
            Action:
              - logs:*LogDelivery
              - logs:ListLogDeliveries
              - logs:DescribeLogGroups
              - logs:DescribeResourcePolicies
              - logs:PutResourcePolicy
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1

          - Sid: ManageAppFunctions
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateAlias
              - lambda:CreateFunction
              - lambda:DeleteAlias
              - lambda:DeleteFunction
              - lambda:Get*
              - lambda:List*
              - lambda:PublishVersion
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:Update*
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout:*
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory:*

          - Sid: ManageAppWebBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucketPolicy
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:ListBucket
              - s3:PutBucket*
              - s3:PutEncryptionConfiguration
              - s3:TagResource
            Resource: arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1

          - Sid: ManageAppApi
            Effect: Allow
            Action:
              - apigateway:DELETE
              - apigateway:GET
              - apigateway:PATCH
              - apigateway:POST
              - apigateway:PUT
            Resource:
              - !Sub arn:aws:apigateway:us-east-1::/apis/${AppHttpApiId}
              - !Sub arn:aws:apigateway:us-east-1::/apis/${AppHttpApiId}/*

          - Sid: CreateNamedAppHttpApi
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:PUT
            Resource: arn:aws:apigateway:us-east-1::/apis
            Condition:
              StringEquals:
                aws:RequestTag/Name: IncidentTriageDemoApp

          - Sid: TagAppApiResources
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:DELETE
            Resource:
              - !Sub arn:aws:apigateway:us-east-1::/tags/arn%3Aaws%3Aapigateway%3Aus-east-1%3A%3A%2Fv2%2Fapis%2F${AppHttpApiId}
              - !Sub arn:aws:apigateway:us-east-1::/tags/arn%3Aaws%3Aapigateway%3Aus-east-1%3A%3A%2Fv2%2Fapis%2F${AppHttpApiId}%2Fstages%2F*

          # CreateStage authorizes its system tags with this exact action
          # and collection ARN, as declared by the CloudFormation provider.
          - Sid: TagAppDefaultStage
            Effect: Allow
            Action: apigateway:TagResource
            Resource: !Sub arn:aws:apigateway:us-east-1::/apis/${AppHttpApiId}/stages

          - Sid: ManageAppCloudFront
            Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:ListOriginAccessControls
            Resource: '*'

          - Sid: CreateAppCloudFrontDistribution
            Effect: Allow
            Action: cloudfront:CreateDistribution
            Resource: '*'

          - Sid: UpdateAppCloudFrontResources
            Effect: Allow
            Action:
              - cloudfront:DeleteDistribution
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:Get*
              - cloudfront:ListTagsForResource
              - cloudfront:TagResource
              - cloudfront:UpdateDistribution
              - cloudfront:UpdateOriginAccessControl
            Resource:
              - !Sub arn:aws:cloudfront::027224425948:distribution/${AppDistributionId}
              - !Sub arn:aws:cloudfront::027224425948:origin-access-control/${AppOriginAccessControlId}

          - Sid: ListAppCloudFrontResources
            Effect: Allow
            Action: cloudfront:ListDistributions
            Resource: '*'

          - Sid: ManageAppRuntimeRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole*
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppCheckoutRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole

          - Sid: CreateCheckoutRuntimeRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAppCheckoutRole
            Condition:
              StringEquals:
                iam:PermissionsBoundary: arn:aws:iam::027224425948:policy/IncidentTriageDemoAppCheckoutRuntimeBoundary

          - Sid: CreateInventoryRuntimeRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
            Condition:
              StringEquals:
                iam:PermissionsBoundary: arn:aws:iam::027224425948:policy/IncidentTriageDemoAppInventoryRuntimeBoundary

          - Sid: PassAppRuntimeRolesToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppCheckoutRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  IncidentTriageDemoAppCheckoutRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoAppCheckoutRuntimeBoundary
      Description: >-
        Administrator-owned maximum permissions for the named checkout Lambda
        runtime role. This boundary is narrower than the app role policy.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CheckoutLogDelivery
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoCheckout:*
          - Sid: CheckoutOrderReads
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoOrders
          - Sid: CheckoutOrderWrite
            Effect: Allow
            Action: dynamodb:PutItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoOrders
            Condition:
              StringEquals:
                dynamodb:EnclosingOperation: TransactWriteItems
          - Sid: CheckoutInventoryWrite
            Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoInventory
            Condition:
              StringEquals:
                dynamodb:EnclosingOperation: TransactWriteItems
          - Sid: CheckoutInventoryInvoke
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory:live

  IncidentTriageDemoAppInventoryRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoAppInventoryRuntimeBoundary
      Description: >-
        Administrator-owned maximum permissions for the named read-only
        inventory Lambda runtime role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InventoryLogDelivery
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoInventory:*
          - Sid: InventoryProductRead
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoInventory


  IncidentTriageDemoControllerCfnExecution:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoControllerCfnExecution
      Description: >-
        Scoped CloudFormation execution permissions for the Incident Triage
        Demo controller stack. This policy is attached alongside the app
        policy on the dedicated CDK execution role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InspectControllerStacks
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource:
              - arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoBootstrap/*
              - arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoController/*

          - Sid: ReadBootstrapVersionMarker
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: arn:aws:ssm:us-east-1:027224425948:parameter/cdk-bootstrap/evaltalk/version

          - Sid: ReadCdkLambdaAssets
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*

          - Sid: ManageControllerRunTable
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:Describe*
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UpdateTable
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun

          - Sid: ManageControllerLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource:
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerHttp
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerHttp:*
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerWorker
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerWorker:*
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/apigateway/IncidentTriageDemoController
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/apigateway/IncidentTriageDemoController:*

          - Sid: ConfigureHttpApiLogDelivery
            Effect: Allow
            Action:
              - logs:*LogDelivery
              - logs:ListLogDeliveries
              - logs:DescribeLogGroups
              - logs:DescribeResourcePolicies
              - logs:PutResourcePolicy
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1

          - Sid: ManageControllerFunctions
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:GetFunction
              - lambda:GetFunctionCodeSigningConfig
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionEventInvokeConfig
              - lambda:GetPolicy
              - lambda:ListTags
              - lambda:PutFunctionEventInvokeConfig
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionEventInvokeConfig
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoControllerHttp
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoControllerHttp:*
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoControllerWorker
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoControllerWorker:*

          - Sid: ManageControllerApi
            Effect: Allow
            Action:
              - apigateway:DELETE
              - apigateway:GET
              - apigateway:PATCH
              - apigateway:POST
              - apigateway:PUT
            Resource:
              - !Sub arn:aws:apigateway:us-east-1::/apis/${ControllerHttpApiId}
              - !Sub arn:aws:apigateway:us-east-1::/apis/${ControllerHttpApiId}/*

          - Sid: CreateNamedControllerHttpApi
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:PUT
            Resource: arn:aws:apigateway:us-east-1::/apis
            Condition:
              StringEquals:
                aws:RequestTag/Name: IncidentTriageDemoController

          - Sid: TagControllerApiResources
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:DELETE
            Resource:
              - !Sub arn:aws:apigateway:us-east-1::/tags/arn%3Aaws%3Aapigateway%3Aus-east-1%3A%3A%2Fv2%2Fapis%2F${ControllerHttpApiId}
              - !Sub arn:aws:apigateway:us-east-1::/tags/arn%3Aaws%3Aapigateway%3Aus-east-1%3A%3A%2Fv2%2Fapis%2F${ControllerHttpApiId}%2Fstages%2F*

          - Sid: TagControllerDefaultStage
            Effect: Allow
            Action: apigateway:TagResource
            Resource: !Sub arn:aws:apigateway:us-east-1::/apis/${ControllerHttpApiId}/stages

          - Sid: ManageControllerRuntimeRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole*
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoControllerHttpRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoControllerWorkerRole

          - Sid: CreateControllerHttpRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoControllerHttpRole
            Condition:
              StringEquals:
                iam:PermissionsBoundary: arn:aws:iam::027224425948:policy/IncidentTriageDemoControllerHttpRuntimeBoundary

          - Sid: CreateControllerWorkerRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoControllerWorkerRole
            Condition:
              StringEquals:
                iam:PermissionsBoundary: arn:aws:iam::027224425948:policy/IncidentTriageDemoControllerWorkerRuntimeBoundary

          - Sid: PassControllerRuntimeRolesToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoControllerHttpRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoControllerWorkerRole
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  IncidentTriageDemoControllerHttpRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoControllerHttpRuntimeBoundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ControllerHttpLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerHttp:*
          - Sid: ControllerHttpTable
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
          - Sid: ControllerHttpSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:027224425948:secret:incident-triage-demo/controller/operator-digest-??????
          - Sid: ControllerHttpWorker
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoControllerWorker
          - Sid: ControllerHttpAlarm
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: arn:aws:cloudwatch:us-east-1:027224425948:alarm:IncidentTriageDemoAppStage5xx

  IncidentTriageDemoControllerWorkerRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoControllerWorkerRuntimeBoundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ControllerWorkerLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:us-east-1:027224425948:log-group:/aws/lambda/IncidentTriageDemoControllerWorker:*
          - Sid: ControllerWorkerTable
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
          - Sid: ControllerWorkerSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:027224425948:secret:incident-triage-demo/controller/app-bearer-??????
          - Sid: ControllerWorkerAppRelease
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource: arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoApp/*
          - Sid: ControllerWorkerAppFunctions
            Effect: Allow
            Action:
              - lambda:GetAlias
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionConcurrency
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout:*
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory:*
          - Sid: ControllerWorkerUpdateInventoryAlias
            Effect: Allow
            Action: lambda:UpdateAlias
            Resource: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
          - Sid: ControllerWorkerInventoryPolicy
            Effect: Allow
            Action: dynamodb:GetResourcePolicy
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoInventory
          - Sid: ControllerWorkerInventoryRoleAttachments
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:ListAttachedRolePolicies
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
          - Sid: ControllerWorkerInventoryReadDenyPolicy
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource: arn:aws:iam::027224425948:policy/IncidentTriageDemoInventoryReadDeny
          - Sid: ControllerWorkerInventoryVariantsManifest
            Effect: Allow
            Action: s3:GetObject
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/releases/app/*/inventory-variants.json
          - Sid: ControllerWorkerAlarm
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - cloudwatch:DescribeAlarmHistory
            Resource: arn:aws:cloudwatch:us-east-1:027224425948:alarm:IncidentTriageDemoAppStage5xx
          - Sid: ControllerWorkerEvidence
            Effect: Allow
            Action: s3:PutObject
            Resource: arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/configuration/*

  IncidentTriageDemoPhase3CfnExecution:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoPhase3CfnExecution
      Description: >-
        Scoped Phase 3 CloudFormation permissions for the named application
        alarm and controller evidence bucket. This policy is attached
        alongside the app and controller execution policies.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageAppStageAlarm
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListTagsForResource
              - cloudwatch:PutMetricAlarm
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: arn:aws:cloudwatch:us-east-1:027224425948:alarm:IncidentTriageDemoAppStage5xx

          - Sid: ManageControllerEvidenceBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:ListBucket
              - s3:PutBucket*
              - s3:PutEncryptionConfiguration
              - s3:TagResource
            Resource: arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1

          - Sid: ManagePreparedInventoryDeniedRole
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole*
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
          - Sid: CreatePreparedInventoryDeniedRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
            Condition:
              StringEquals:
                iam:PermissionsBoundary: arn:aws:iam::027224425948:policy/IncidentTriageDemoAppInventoryRuntimeBoundary

          - Sid: AttachPreparedInventoryDeny
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
            Condition:
              StringEquals:
                iam:PolicyARN: arn:aws:iam::027224425948:policy/IncidentTriageDemoInventoryReadDeny

          - Sid: PassPreparedInventoryRolesToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  IncidentTriageDemoInventoryReadDeny:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: IncidentTriageDemoInventoryReadDeny
      Description: >-
        Administrator-owned, unattached Deny used by the Incident Triage Demo
        to block Inventory GetItem calls during the access-denial incident.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInventoryGetItem
            Effect: Deny
            Action: dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoInventory

Outputs:
  PolicyArn:
    Description: Managed policy ARN to pass as CloudFormationExecutionPolicies during bootstrap.
    Value:
      Ref: IncidentTriageDemoBootstrapCfnExecution
  ControllerPolicyArn:
    Description: Separate managed policy ARN for the controller stack deployment.
    Value:
      Ref: IncidentTriageDemoControllerCfnExecution
  Phase3PolicyArn:
    Description: Managed policy ARN for the Phase 3 alarm and evidence bucket grants.
    Value:
      Ref: IncidentTriageDemoPhase3CfnExecution
