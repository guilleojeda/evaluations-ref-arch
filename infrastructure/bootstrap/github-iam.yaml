AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Incident Triage Demo GitHub Actions OIDC provider and deployment role.
  The role can only assume the CDK deploy and file-publishing roles created by
  the dedicated evaltalk bootstrap stack.
Metadata:
  cfn-lint:
    config:
      # IAM retrieves the issuer certificate thumbprint when ThumbprintList is
      # omitted. Older cfn-lint schemas still mark that property as required.
      ignore_checks:
        - E3003

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      Existing provider ARN to reuse after confirming its URL and
      sts.amazonaws.com client ID. Leave empty only when creating the provider.
    AllowedPattern: '^$|^arn:[A-Za-z0-9-]+:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'

Conditions:
  CreateGitHubOidcProvider:
    Fn::Equals:
      - ''
      - Ref: GitHubOidcProviderArn

Resources:
  DedicatedCdkDeployRolePhase0Guard:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: IncidentTriageDemoPhase0DeployProbeOnly
      Roles:
        - Fn::Sub: cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonAppDeploymentActions
            Effect: Deny
            NotAction:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:DescribeChangeSet
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - iam:PassRole
              - kms:Decrypt
              - kms:DescribeKey
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - xray:GetTraceSegmentDestination
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
              - lambda:GetAlias
              - lambda:GetFunctionConfiguration
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:UpdateFunctionConfiguration
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - ssm:GetParameter
              - ssm:GetParameters
              - sts:GetCallerIdentity
            Resource: '*'
          - Sid: DenyProductActionsOutsideNamedStacks
            Effect: Deny
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoApp/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoController/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoAgent/*
          - Sid: DenyAppReadsOutsideApprovedStacks
            Effect: Deny
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:DescribeChangeSet
              - ssm:GetParameter
              - ssm:GetParameters
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoBootstrap*/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoApp/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoController/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoAgent/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/evaltalk/version
          - Sid: DenyPassRoleOutsideCdkExecutionRole
            Effect: Deny
            Action: iam:PassRole
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-cfn-exec-role-${AWS::AccountId}-${AWS::Region}
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAppInventoryRole
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAppInventoryDeniedRole
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAgentRuntimeRole
          # CloudFormation retrieves the checked JSON template from the
          # SSE-KMS bootstrap bucket using the deployment caller's authority.
          - Sid: DenyDecryptOutsideBootstrapS3Key
            Effect: Deny
            Action: kms:Decrypt
            NotResource:
              - arn:aws:kms:us-east-1:027224425948:key/b292b95c-709f-42c6-aa42-b934ba2c6f07
              - arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
          - Sid: DenyBootstrapKeyOutsideBootstrapTemplates
            Effect: Deny
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/b292b95c-709f-42c6-aa42-b934ba2c6f07
            Condition:
              StringNotLike:
                kms:EncryptionContext:aws:s3:arn:
                  - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*.json
                  - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*.zip
          # Inventory and the alarm adapter share the existing Lambda KMS key.
          # Keep decryption limited to their exact environment contexts.
          - Sid: DenyLambdaKeyOutsideApprovedEnvironments
            Effect: Deny
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
            Condition:
              StringNotLike:
                kms:EncryptionContext:aws:lambda:FunctionArn:
                  - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
                  - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoAlarmAdapter
          - Sid: DenyDescribeKeyOutsideInventoryEnvironmentKey
            Effect: Deny
            Action: kms:DescribeKey
            NotResource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
          - Sid: DenyDescribeInventoryKeyOutsideLambdaService
            Effect: Deny
            Action: kms:DescribeKey
            Resource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
            Condition:
              StringNotEquals:
                kms:ViaService: lambda.us-east-1.amazonaws.com
          - Sid: DenyPublishingOutsideAppWebObjects
            Effect: Deny
            Action: s3:PutObject
            NotResource:
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/assets/*
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/index.html
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/releases/app/*/inventory-variants.json
          - Sid: PublishPhase1AppWebBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1
          - Sid: PublishPhase1AppWebObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/assets/*
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/index.html
          - Sid: ReadPhase1AppLiveAliases
            Effect: Allow
            Action: lambda:GetAlias
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
          - Sid: AllowPhase0BootstrapProbeReads
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource: arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoBootstrap/*
          - Sid: ReadPhase0BootstrapVersion
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: arn:aws:ssm:us-east-1:027224425948:parameter/cdk-bootstrap/evaltalk/version
          - Sid: IdentifyPhase0Caller
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'
          - Sid: PrepareInventoryReleaseVariants
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - lambda:GetAlias
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:UpdateFunctionConfiguration
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory:*
          - Sid: ReadInventoryReleaseRolesAndPolicy
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListAttachedRolePolicies
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
              - arn:aws:iam::027224425948:policy/IncidentTriageDemoInventoryReadDeny
          - Sid: PassInventoryReleaseRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: VerifyTransactionSearch
            Effect: Allow
            Action: xray:GetTraceSegmentDestination
            Resource: '*'
          - Sid: FinalizeCheckedAgentRuntime
            Effect: Allow
            Action:
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-*
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-*/runtime-endpoint/faulty
          - Sid: AttestVerifiedRuntimeInAdapter
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionConfiguration
            Resource: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoAlarmAdapter
          - Sid: PassCheckedAgentRole
            Effect: Allow
            Action: iam:PassRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAgentRuntimeRole
            Condition:
              StringEquals:
                iam:PassedToService: bedrock-agentcore.amazonaws.com
          - Sid: ReadInventoryReleaseManifestBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1
          - Sid: PublishInventoryReleaseManifest
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/releases/app/*/inventory-variants.json

  GitHubOidcProvider:
    Condition: CreateGitHubOidcProvider
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub

  GitHubDeployRole:
    DependsOn: DedicatedCdkDeployRolePhase0Guard
    Type: AWS::IAM::Role
    Properties:
      RoleName: IncidentTriageDemoGitHubDeploy
      Description: >-
        GitHub Actions deployment identity for the pinned main workflow of
        guilleojeda/evaluations-ref-arch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactMainWorkflow
            Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateGitHubOidcProvider
                  - Fn::GetAtt:
                      - GitHubOidcProvider
                      - Arn
                  - Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_id:
                  '1411023195'
                token.actions.githubusercontent.com:ref:
                  refs/heads/main
      Policies:
        - PolicyName: AssumeCdkDeploymentRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeDedicatedCdkDeployRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
              - Sid: AssumeDedicatedCdkFilePublishingRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-file-publishing-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub
        - Key: GitHubRepositoryId
          Value: '1411023195'
        - Key: GitHubWorkflow
          Value: .github/workflows/deploy.yml

Outputs:
  GitHubDeployRoleArn:
    Description: Role assumed by the pinned GitHub Actions workflow.
    Value:
      Fn::GetAtt:
        - GitHubDeployRole
        - Arn
  GitHubOidcProviderArn:
    Description: GitHub OIDC provider used by the role trust policy.
    Value:
      Fn::If:
        - CreateGitHubOidcProvider
        - Fn::GetAtt:
            - GitHubOidcProvider
            - Arn
        - Ref: GitHubOidcProviderArn
  GitHubOidcSubject:
    Description: Exact immutable subject accepted by the role trust policy.
    Value:
      repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/main
  CdkDeployRoleArn:
    Description: Dedicated CDK deployment role the GitHub role may assume.
    Value:
      Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
  CdkFilePublishingRoleArn:
    Description: Dedicated CDK file-publishing role the GitHub role may assume.
    Value:
      Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-file-publishing-role-${AWS::AccountId}-${AWS::Region}
