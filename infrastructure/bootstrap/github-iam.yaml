AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Incident Triage Demo GitHub Actions OIDC provider and isolated workflow
  roles. The infrastructure role retains the existing CDK deployment path;
  evaluation and repaired publication use separate environment-bound roles.
Metadata:
  cfn-lint:
    config:
      # IAM retrieves the issuer certificate thumbprint when ThumbprintList is
      # omitted. Older cfn-lint schemas still mark that property as required.
      ignore_checks:
        - E3003

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      Existing provider ARN to reuse after confirming its URL and
      sts.amazonaws.com client ID. Leave empty only when creating the provider.
    AllowedPattern: '^$|^arn:[A-Za-z0-9-]+:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'

Conditions:
  CreateGitHubOidcProvider:
    Fn::Equals:
      - ''
      - Ref: GitHubOidcProviderArn

Resources:
  DedicatedCdkDeployRolePhase0Guard:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: IncidentTriageDemoPhase0DeployProbeOnly
      Roles:
        - Fn::Sub: cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonAppDeploymentActions
            Effect: Deny
            NotAction:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:DescribeChangeSet
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - iam:PassRole
              - kms:Decrypt
              - kms:Encrypt
              - kms:DescribeKey
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - xray:GetTraceSegmentDestination
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:ListAgentRuntimeVersions
              - bedrock-agentcore:CreateAgentRuntimeEndpoint
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
              - dynamodb:GetItem
              - dynamodb:PutItem
              - lambda:GetAlias
              - lambda:GetFunctionConfiguration
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:UpdateFunctionConfiguration
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - ssm:GetParameter
              - ssm:GetParameters
              - sts:GetCallerIdentity
            Resource: '*'
          - Sid: DenyProductActionsOutsideNamedStacks
            Effect: Deny
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoApp/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoController/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoAgent/*
          - Sid: DenyAppReadsOutsideApprovedStacks
            Effect: Deny
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:DescribeChangeSet
              - ssm:GetParameter
              - ssm:GetParameters
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoBootstrap*/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoApp/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoController/*
              - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/IncidentTriageDemoAgent/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/evaltalk/version
          - Sid: DenyPassRoleOutsideCdkExecutionRole
            Effect: Deny
            Action: iam:PassRole
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-cfn-exec-role-${AWS::AccountId}-${AWS::Region}
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAppInventoryRole
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAppInventoryDeniedRole
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/IncidentTriageDemoAgentRuntimeRole
          # CloudFormation retrieves the checked JSON template from the
          # SSE-KMS bootstrap bucket using the deployment caller's authority.
          - Sid: DenyDecryptOutsideBootstrapS3Key
            Effect: Deny
            Action: kms:Decrypt
            NotResource:
              - arn:aws:kms:us-east-1:027224425948:key/b292b95c-709f-42c6-aa42-b934ba2c6f07
              - arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
              - arn:aws:kms:us-east-1:027224425948:key/2a020640-e95b-4bec-8ae7-3f6d9fcb8e0d
          - Sid: DenyBootstrapKeyOutsideBootstrapTemplates
            Effect: Deny
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/b292b95c-709f-42c6-aa42-b934ba2c6f07
            Condition:
              StringNotLike:
                kms:EncryptionContext:aws:s3:arn:
                  - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*.json
                  - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/*.zip
                  - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/agent-reference/*
          # Inventory and the alarm adapter share the existing Lambda KMS key.
          # Keep decryption limited to their exact environment contexts.
          - Sid: DenyLambdaKeyOutsideApprovedEnvironments
            Effect: Deny
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
            Condition:
              StringNotLike:
                kms:EncryptionContext:aws:lambda:FunctionArn:
                  - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
                  - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoAlarmAdapter
          # Updating the adapter attestation encrypts its environment again.
          - Sid: DenyEncryptOutsideAdapterEnvironment
            Effect: Deny
            Action: kms:Encrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
            Condition:
              StringNotEquals:
                kms:EncryptionContext:aws:lambda:FunctionArn: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoAlarmAdapter
          - Sid: DenyEncryptOrDescribeOtherKeys
            Effect: Deny
            Action:
              - kms:DescribeKey
              - kms:Encrypt
            NotResource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
          - Sid: DenyEncryptOrDescribeOutsideLambda
            Effect: Deny
            Action:
              - kms:DescribeKey
              - kms:Encrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/9d894f12-dc33-4332-bb3e-df489928914b
            Condition:
              StringNotEquals:
                kms:ViaService: lambda.us-east-1.amazonaws.com
          - Sid: DenyPublishingOutsideAppWebObjects
            Effect: Deny
            Action: s3:PutObject
            NotResource:
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/assets/*
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/index.html
              - arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/releases/app/*/inventory-variants.json
          - Sid: DenyOtherControllerRecords
            Effect: Deny
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
            Condition:
              ForAnyValue:StringNotEquals:
                dynamodb:LeadingKeys:
                  - AGENT_PUBLICATION#faulty
          - Sid: PublishPhase1AppWebBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1
          - Sid: PublishPhase1AppWebObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/assets/*
              - arn:aws:s3:::incident-triage-demo-web-027224425948-us-east-1/index.html
          - Sid: ReadPhase1AppLiveAliases
            Effect: Allow
            Action: lambda:GetAlias
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoCheckout
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
          - Sid: AllowPhase0BootstrapProbeReads
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListStackResources
            Resource: arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoBootstrap/*
          - Sid: ReadPhase0BootstrapVersion
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: arn:aws:ssm:us-east-1:027224425948:parameter/cdk-bootstrap/evaltalk/version
          - Sid: IdentifyPhase0Caller
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'
          - Sid: PrepareInventoryReleaseVariants
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - lambda:GetAlias
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:UpdateFunctionConfiguration
            Resource:
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory
              - arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoInventory:*
          - Sid: ReadInventoryReleaseRolesAndPolicy
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListAttachedRolePolicies
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
              - arn:aws:iam::027224425948:policy/IncidentTriageDemoInventoryReadDeny
          - Sid: PassInventoryReleaseRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryRole
              - arn:aws:iam::027224425948:role/IncidentTriageDemoAppInventoryDeniedRole
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: VerifyTransactionSearch
            Effect: Allow
            Action: xray:GetTraceSegmentDestination
            Resource: '*'
  Phase19PublisherPermissions:
    DependsOn: DedicatedCdkDeployRolePhase0Guard
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IncidentTriageDemoPhase19Publisher
      Description: >-
        Existing release-finalization grants plus the fixed Phase 19 faulty
        reference publisher grants. All resources remain explicitly scoped.
      Roles:
        - Fn::Sub: cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FinalizeCheckedAgentRuntime
            Effect: Allow
            Action:
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
            Resource:
              # AgentCore Runtime IDs have a ten-character generated suffix.
              # Keep the runtime ARN pattern from also matching endpoint ARNs.
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-??????????
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-??????????/runtime-endpoint/faulty
          # AgentCore authorizes CreateAgentRuntimeEndpoint against the
          # synthetic endpoint collection before the requested endpoint name
          # exists (runtime/.../runtime-endpoint/*). Keep this create-only
          # grant pinned to the observed Runtime; the fixed workflow supplies
          # the only approved endpoint name, `faulty`.
          - Sid: CreateCheckedAgentRuntimeEndpoint
            Effect: Allow
            Action: bedrock-agentcore:CreateAgentRuntimeEndpoint
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4/runtime-endpoint/*
          # ListAgentRuntimeVersions has no resource type in the AgentCore
          # service authorization model. Keep it region-limited; the fixed
          # publisher resolves the Runtime only from the named stack output.
          - Sid: ListRuntimeVersions
            Effect: Allow
            Action: bedrock-agentcore:ListAgentRuntimeVersions
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: AttestVerifiedRuntimeInAdapter
            Effect: Allow
            Action:
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionConfiguration
            Resource: arn:aws:lambda:us-east-1:027224425948:function:IncidentTriageDemoAlarmAdapter
          - Sid: PassCheckedAgentRole
            Effect: Allow
            Action: iam:PassRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAgentRuntimeRole
            Condition:
              StringEquals:
                iam:PassedToService: bedrock-agentcore.amazonaws.com
          - Sid: ReadInventoryReleaseManifestBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1
          - Sid: PublishInventoryReleaseManifest
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/releases/app/*/inventory-variants.json
          - Sid: ReadAgentReference
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/agent-reference/*
          - Sid: PublishFaultyRecord
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - AGENT_PUBLICATION#faulty
          # DynamoDB decrypts its table key on behalf of this caller. Keep
          # this separate from the S3/Lambda KMS grants and bind it to the
          # exact table encryption context observed in CloudTrail and the
          # DynamoDB-managed KMS grant.
          - Sid: DecryptFaultyControllerRecord
            Effect: Allow
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/2a020640-e95b-4bec-8ae7-3f6d9fcb8e0d
            Condition:
              StringEquals:
                kms:ViaService: dynamodb.us-east-1.amazonaws.com
                kms:EncryptionContext:aws:dynamodb:tableName: IncidentTriageDemoControllerRun
                kms:EncryptionContext:aws:dynamodb:subscriberId: '027224425948'

  # The evaluation job runs the checked ARM64 package and the approved
  # evaluator, then stages only private evidence. It deliberately has no STS
  # AssumeRole grant: in particular it cannot enter the legacy CDK/file role
  # chain or the repaired publisher role.
  GitHubEvaluationPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IncidentTriageDemoGitHubEvaluation
      Description: >-
        Phase 20 evaluation-only access to the fixed evaluator, model, private
        captured inputs, bounded telemetry and qualification evidence.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EvaluateReviewedSessions
            Effect: Allow
            Action:
              - bedrock-agentcore:Evaluate
              - bedrock-agentcore:GetEvaluator
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:evaluator/IncidentTriageSemanticSingle_35bc9bb6f79d8f15b8-T0jdxk8nzC
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:evaluator/IncidentTriageSemanticSingle_19e82868f272303dbb-hCLeh6Dc1x
          - Sid: InvokeReviewedModels
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - arn:aws:bedrock:us-east-1:027224425948:inference-profile/us.anthropic.claude-sonnet-4-6
              - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6
              - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
              - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
          - Sid: ReadEvaluationLogQueries
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
              - logs:StopQuery
            Resource:
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/bedrock-agentcore/incident-triage-evaluation
              - arn:aws:logs:us-east-1:027224425948:log-group:/aws/bedrock-agentcore/incident-triage-evaluation:*
          - Sid: WriteEvaluationSpans
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:us-east-1:027224425948:log-group:/aws/bedrock-agentcore/incident-triage-evaluation:log-stream:spans
          - Sid: ExportEvaluationTraces
            Effect: Allow
            Action: xray:PutTraceSegments
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: ReadReviewedEvaluationInputs
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/reviewed-cases/phase14/*
              - arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/agent-evaluation/phase18/*
              - arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/agent-evaluation/phase20/*
          - Sid: StageEvaluationEvidence
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/agent-evaluation/phase20/*
          - Sid: IdentifyEvaluationCaller
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'

  # The protected publication job has direct, repaired-only serving authority.
  # It never assumes the legacy deployment role and cannot write the faulty
  # endpoint, adapter, app/controller stacks, or arbitrary controller rows.
  GitHubRepairedPublisherPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IncidentTriageDemoGitHubRepairedPublisher
      Description: >-
        Phase 20 protected publication of the exactly qualified repaired
        Runtime tuple and repaired controller record only.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadAgentRuntime
            Effect: Allow
            Action: bedrock-agentcore:GetAgentRuntime
            Resource: arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-??????????
          - Sid: UpdateQualifiedAgentRuntime
            Effect: Allow
            Action: bedrock-agentcore:UpdateAgentRuntime
            Resource: arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-??????????
          - Sid: ListAgentRuntimeVersions
            Effect: Allow
            Action: bedrock-agentcore:ListAgentRuntimeVersions
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Sid: ReadFaultyAndRepairedEndpoints
            Effect: Allow
            Action: bedrock-agentcore:GetAgentRuntimeEndpoint
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4/runtime-endpoint/faulty
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4/runtime-endpoint/repaired
          - Sid: CreateRepairedEndpoint
            Effect: Allow
            Action: bedrock-agentcore:CreateAgentRuntimeEndpoint
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4/runtime-endpoint/*
          - Sid: UpdateRepairedEndpoint
            Effect: Allow
            Action: bedrock-agentcore:UpdateAgentRuntimeEndpoint
            Resource:
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4
              - arn:aws:bedrock-agentcore:us-east-1:027224425948:runtime/IncidentTriageDemoAgent-7VWTOWDIs4/runtime-endpoint/repaired
          - Sid: PassAgentRuntimeRole
            Effect: Allow
            Action: iam:PassRole
            Resource: arn:aws:iam::027224425948:role/IncidentTriageDemoAgentRuntimeRole
            Condition:
              StringEquals:
                iam:PassedToService: bedrock-agentcore.amazonaws.com
          - Sid: ReadAgentStackRuntimeIdentity
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoAgent/*
          - Sid: ReadPrivateQualification
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/agent-evaluation/phase20/*
              - arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/reviewed-cases/phase14/*
          - Sid: ReadQualifiedServingInputs
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/agent-qualified/*
          - Sid: PublishQualifiedRuntimeArtifact
            Effect: Allow
            Action: s3:PutObject
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/agent-qualified/*.zip
          - Sid: LocateQualifiedObjects
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1
            Condition:
              StringLike:
                s3:prefix: agent-qualified/*
          - Sid: UseQualifiedAssetKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: arn:aws:kms:us-east-1:027224425948:key/b292b95c-709f-42c6-aa42-b934ba2c6f07
            Condition:
              StringEquals:
                kms:ViaService: s3.us-east-1.amazonaws.com
              StringLike:
                kms:EncryptionContext:aws:s3:arn: arn:aws:s3:::cdk-evaltalk-assets-027224425948-us-east-1/agent-qualified/*
          - Sid: ReadPublicationRows
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - AGENT_PUBLICATION#faulty
                  - AGENT_PUBLICATION#repaired
          - Sid: PublishRepairedRecord
            Effect: Allow
            Action: dynamodb:PutItem
            Resource: arn:aws:dynamodb:us-east-1:027224425948:table/IncidentTriageDemoControllerRun
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - AGENT_PUBLICATION#repaired
          - Sid: DecryptPublicationRecords
            Effect: Allow
            Action: kms:Decrypt
            Resource: arn:aws:kms:us-east-1:027224425948:key/2a020640-e95b-4bec-8ae7-3f6d9fcb8e0d
            Condition:
              StringEquals:
                kms:ViaService: dynamodb.us-east-1.amazonaws.com
                kms:EncryptionContext:aws:dynamodb:tableName: IncidentTriageDemoControllerRun
                kms:EncryptionContext:aws:dynamodb:subscriberId: '027224425948'
          - Sid: IdentifyPublisherCaller
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'

  GitHubOidcProvider:
    Condition: CreateGitHubOidcProvider
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub

  GitHubDeployRole:
    DependsOn: DedicatedCdkDeployRolePhase0Guard
    Type: AWS::IAM::Role
    Properties:
      RoleName: IncidentTriageDemoGitHubDeploy
      Description: >-
        GitHub Actions deployment identity for the pinned demo-deploy workflow of
        guilleojeda/evaluations-ref-arch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactDemoDeployWorkflow
            Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateGitHubOidcProvider
                  - Fn::GetAtt:
                      - GitHubOidcProvider
                      - Arn
                  - Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/demo-deploy
                token.actions.githubusercontent.com:repository_id:
                  '1411023195'
                token.actions.githubusercontent.com:ref:
                  refs/heads/demo-deploy
                token.actions.githubusercontent.com:environment: demo-infrastructure
      Policies:
        - PolicyName: AssumeCdkDeploymentRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeDedicatedCdkDeployRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
              - Sid: AssumeDedicatedCdkFilePublishingRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-file-publishing-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub
        - Key: GitHubRepositoryId
          Value: '1411023195'
        - Key: GitHubWorkflow
          Value: .github/workflows/deploy.yml

  GitHubEvaluationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IncidentTriageDemoGitHubEvaluation
      Description: >-
        GitHub Actions identity for the isolated Phase 20 evaluation job. It
        cannot assume deployment, file-publishing, or repaired-publisher roles.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactDemoEvaluationWorkflow
            Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateGitHubOidcProvider
                  - Fn::GetAtt:
                      - GitHubOidcProvider
                      - Arn
                  - Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/demo-deploy
                token.actions.githubusercontent.com:repository_id:
                  '1411023195'
                token.actions.githubusercontent.com:ref:
                  refs/heads/demo-deploy
                token.actions.githubusercontent.com:environment:
                  - demo-evaluation
                  - repaired-publication
      ManagedPolicyArns:
        - Ref: GitHubEvaluationPermissions
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub
        - Key: GitHubRepositoryId
          Value: '1411023195'
        - Key: GitHubWorkflow
          Value: .github/workflows/deploy.yml
        - Key: GitHubEnvironment
          Value: demo-evaluation and repaired-publication

  GitHubRepairedPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IncidentTriageDemoGitHubRepairedPublisher
      Description: >-
        GitHub Actions identity for the protected Phase 20 repaired publisher.
        It has no CDK, file-publishing, faulty-endpoint, or adapter authority.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactProtectedRepairedPublicationWorkflow
            Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateGitHubOidcProvider
                  - Fn::GetAtt:
                      - GitHubOidcProvider
                      - Arn
                  - Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/demo-deploy
                token.actions.githubusercontent.com:repository_id:
                  '1411023195'
                token.actions.githubusercontent.com:ref:
                  refs/heads/demo-deploy
                token.actions.githubusercontent.com:environment: repaired-publication
      ManagedPolicyArns:
        - Ref: GitHubRepairedPublisherPermissions
      Tags:
        - Key: Project
          Value: IncidentTriageDemo
        - Key: ManagedBy
          Value: IncidentTriageDemoGitHub
        - Key: GitHubRepositoryId
          Value: '1411023195'
        - Key: GitHubWorkflow
          Value: .github/workflows/deploy.yml
        - Key: GitHubEnvironment
          Value: repaired-publication

Outputs:
  GitHubDeployRoleArn:
    Description: Role assumed by the pinned GitHub Actions workflow.
    Value:
      Fn::GetAtt:
        - GitHubDeployRole
        - Arn
  GitHubOidcProviderArn:
    Description: GitHub OIDC provider used by the role trust policy.
    Value:
      Fn::If:
        - CreateGitHubOidcProvider
        - Fn::GetAtt:
            - GitHubOidcProvider
            - Arn
        - Ref: GitHubOidcProviderArn
  GitHubOidcSubject:
    Description: Exact immutable subject accepted by the role trust policy.
    Value:
      repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/demo-deploy
  GitHubEvaluationRoleArn:
    Description: Isolated evaluation/read-staging role accepted by the demo-evaluation and repaired-publication job environments.
    Value:
      Fn::GetAtt:
        - GitHubEvaluationRole
        - Arn
  GitHubRepairedPublisherRoleArn:
    Description: Protected repaired publication role accepted only by the repaired-publication environment.
    Value:
      Fn::GetAtt:
        - GitHubRepairedPublisherRole
        - Arn
  CdkDeployRoleArn:
    Description: Dedicated CDK deployment role the GitHub role may assume.
    Value:
      Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-deploy-role-${AWS::AccountId}-${AWS::Region}
  CdkFilePublishingRoleArn:
    Description: Dedicated CDK file-publishing role the GitHub role may assume.
    Value:
      Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-evaltalk-file-publishing-role-${AWS::AccountId}-${AWS::Region}
