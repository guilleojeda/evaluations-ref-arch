[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "Read-only incident investigation agent and its Strands and AgentCore evaluation workflows"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aws-opentelemetry-distro==0.24.0",
  "bedrock-agentcore==1.25.3",
  "boto3==1.43.125",
  "strands-agents==1.65.0",
]

[dependency-groups]
adapter = ["boto3==1.43.125"]
dev = ["strands-agents-evals==1.9.0"]

[tool.uv]
required-version = "==0.13.6"
