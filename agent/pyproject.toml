[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "Credential-free AgentCore runtime starter for the incident triage demo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aws-opentelemetry-distro==0.18.0",
  "bedrock-agentcore==1.25.3",
  "boto3==1.43.125",
  "strands-agents==1.64.0",
]

[dependency-groups]
adapter = ["boto3==1.43.125"]

[tool.uv]
required-version = "==0.13.6"
