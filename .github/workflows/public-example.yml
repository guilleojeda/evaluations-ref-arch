name: Public Inventory Example

on:
  pull_request:
    paths:
      - README.md
      - docs/adapt-evaluations.md
      - agent/**
      - examples/inventory-denial/**
      - .github/workflows/public-example.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/adapt-evaluations.md
      - agent/**
      - examples/inventory-denial/**
      - .github/workflows/public-example.yml

permissions:
  contents: read

jobs:
  public-example:
    name: Public Inventory example
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - name: Install locked agent dependencies
        run: uv sync --project agent --locked
      - name: Run public Inventory example checks offline
        run: uv run --offline --project agent --locked python examples/inventory-denial/test_public_example.py
