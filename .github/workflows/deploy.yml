name: Incident Triage Demo Deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: Independently checked stack to deploy or recover
        required: true
        type: choice
        options:
          - app
          - controller
          - agent
          - reference-setup
      rotation_from_generation:
        description: Current app credential generation (app only; leave blank for an ordinary release)
        required: false
        default: ''
        type: string
      rotation_to_generation:
        description: New app credential generation (app only; leave blank for an ordinary release)
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - demo-deploy

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: '027224425948'
  AWS_PAGER: ''
  PHASE0_GITHUB_REPOSITORY: guilleojeda/evaluations-ref-arch
  PHASE0_GITHUB_REPOSITORY_ID: '1411023195'
  PHASE0_AWS_ACCOUNT_ID: '027224425948'
  PHASE0_AWS_REGION: us-east-1
  PHASE0_DEPLOY_ROLE_ARN: arn:aws:iam::027224425948:role/IncidentTriageDemoGitHubDeploy
  PHASE0_EXPECTED_OIDC_SUBJECT: repo:guilleojeda@18320860/evaluations-ref-arch@1411023195:workflow_ref:guilleojeda/evaluations-ref-arch/.github/workflows/deploy.yml@refs/heads/demo-deploy
  PHASE0_CDK_QUALIFIER: evaltalk
  PHASE0_CDK_BOOTSTRAP_STACK: IncidentTriageDemoBootstrap
  PHASE0_APP_STACK: IncidentTriageDemoApp
  PHASE0_CONTROLLER_STACK: IncidentTriageDemoController
  PHASE0_AGENT_STACK: IncidentTriageDemoAgent
  PHASE1_WEB_BUCKET: incident-triage-demo-web-027224425948-us-east-1
  CDK_DEPLOY_ROLE_ARN: arn:aws:iam::027224425948:role/cdk-evaltalk-deploy-role-027224425948-us-east-1
  CDK_FILE_PUBLISHING_ROLE_ARN: arn:aws:iam::027224425948:role/cdk-evaltalk-file-publishing-role-027224425948-us-east-1
  PHASE0_ASSET_BUCKET: cdk-evaltalk-assets-027224425948-us-east-1
  # Phase 20 uses separate identities for evaluation and serving publication.
  # These values are deliberately fixed workflow inputs; they are not caller-
  # selectable dispatch parameters.
  PHASE20_EVALUATION_ROLE_ARN: arn:aws:iam::027224425948:role/IncidentTriageDemoGitHubEvaluation
  PHASE20_PUBLISHER_ROLE_ARN: arn:aws:iam::027224425948:role/IncidentTriageDemoGitHubRepairedPublisher
  PHASE20_EVIDENCE_BUCKET: incident-triage-demo-evidence-027224425948-us-east-1
  PHASE20_ALARM_ARN: arn:aws:cloudwatch:us-east-1:027224425948:alarm:IncidentTriageDemoAppStage5xx
  PHASE20_REVIEWER_ID: '18320860'
  PHASE20_REVIEWER_LOGIN: guilleojeda
  PHASE20_ENVIRONMENT_ID: '27678290254'

permissions:
  contents: read

jobs:
  route:
    name: Select affected stacks
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.select.outputs.components }}
      check_components: ${{ steps.select.outputs.check_components }}
      agent_components: ${{ steps.select.outputs.agent_components }}
      deploy_components: ${{ steps.select.outputs.deploy_components }}
      agent_infrastructure_only: ${{ steps.select.outputs.agent_infrastructure_only }}
      qualification_required: ${{ steps.select.outputs.qualification_required }}
      reconcile_after_gate: ${{ steps.select.outputs.reconcile_after_gate }}
      operation: ${{ steps.select.outputs.operation }}
      reference_setup: ${{ steps.select.outputs.reference_setup }}
      rotation_from_generation: ${{ steps.select.outputs.rotation_from_generation }}
      rotation_to_generation: ${{ steps.select.outputs.rotation_to_generation }}
    steps:
      - name: Check out revisions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Select changed components
        id: select
        shell: bash
        env:
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_ROTATION_FROM: ${{ inputs.rotation_from_generation }}
          DISPATCH_ROTATION_TO: ${{ inputs.rotation_to_generation }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            component="$DISPATCH_COMPONENT"
            rotation_from="${DISPATCH_ROTATION_FROM:-}"
            rotation_to="${DISPATCH_ROTATION_TO:-}"
            if [[ "$component" == reference-setup ]]; then
              [[ "${{ github.ref }}" == "refs/heads/demo-deploy" ]] || {
                echo "reference-setup is only allowed on refs/heads/demo-deploy" >&2
                exit 1
              }
              [[ -z "$rotation_from" && -z "$rotation_to" ]] || {
                echo "reference-setup cannot combine with credential rotation" >&2
                exit 1
              }
              echo 'components=["agent"]' >> "$GITHUB_OUTPUT"
              echo 'check_components=[]' >> "$GITHUB_OUTPUT"
              echo 'agent_components=["agent"]' >> "$GITHUB_OUTPUT"
              echo 'deploy_components=["agent"]' >> "$GITHUB_OUTPUT"
              echo 'agent_infrastructure_only=false' >> "$GITHUB_OUTPUT"
              echo 'qualification_required=false' >> "$GITHUB_OUTPUT"
              echo 'reconcile_after_gate=false' >> "$GITHUB_OUTPUT"
              echo 'operation=reference-setup' >> "$GITHUB_OUTPUT"
              echo 'reference_setup=true' >> "$GITHUB_OUTPUT"
              echo 'rotation_from_generation=' >> "$GITHUB_OUTPUT"
              echo 'rotation_to_generation=' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$component" in app|controller|agent) ;; *) echo "Invalid component" >&2; exit 1 ;; esac
            case "$rotation_from$rotation_to" in
              '') ;;
              *)
                [[ "$component" == app ]] || { echo "Credential rotation is only valid for the app component" >&2; exit 1; }
                [[ -n "$rotation_from" && -n "$rotation_to" ]] || {
                  echo "Credential rotation requires both generation inputs" >&2
                  exit 1
                }
                [[ "${#rotation_from}" -le 128 && "${#rotation_to}" -le 128 && "$rotation_from" =~ ^[A-Za-z0-9._-]+$ && "$rotation_to" =~ ^[A-Za-z0-9._-]+$ ]] || {
                  echo "Credential generation inputs contain unsupported characters" >&2
                  exit 1
                }
                [[ "$rotation_from" != "$rotation_to" ]] || {
                  echo "Credential rotation generations must differ" >&2
                  exit 1
                }
                ;;
            esac
            echo "components=$(node -p 'JSON.stringify([process.argv[1]])' "$component")" >> "$GITHUB_OUTPUT"
            if [[ "$component" == agent ]]; then
              echo 'deploy_components=[]' >> "$GITHUB_OUTPUT"
              echo 'check_components=[]' >> "$GITHUB_OUTPUT"
              echo 'agent_components=["agent"]' >> "$GITHUB_OUTPUT"
              echo 'agent_infrastructure_only=false' >> "$GITHUB_OUTPUT"
              echo 'qualification_required=true' >> "$GITHUB_OUTPUT"
              echo 'reconcile_after_gate=true' >> "$GITHUB_OUTPUT"
            else
              echo "deploy_components=$(node -p 'JSON.stringify([process.argv[1]])' "$component")" >> "$GITHUB_OUTPUT"
              echo "check_components=$(node -p 'JSON.stringify([process.argv[1]])' "$component")" >> "$GITHUB_OUTPUT"
              echo 'agent_components=[]' >> "$GITHUB_OUTPUT"
              echo 'agent_infrastructure_only=false' >> "$GITHUB_OUTPUT"
              echo 'qualification_required=false' >> "$GITHUB_OUTPUT"
              echo 'reconcile_after_gate=false' >> "$GITHUB_OUTPUT"
            fi
            echo 'operation=normal' >> "$GITHUB_OUTPUT"
            echo 'reference_setup=false' >> "$GITHUB_OUTPUT"
            case "$rotation_from$rotation_to" in
              '') ;;
              *)
                echo "rotation_from_generation=$rotation_from" >> "$GITHUB_OUTPUT"
                echo "rotation_to_generation=$rotation_to" >> "$GITHUB_OUTPUT"
                ;;
            esac
            exit 0
          fi
          echo 'operation=normal' >> "$GITHUB_OUTPUT"
          echo 'reference_setup=false' >> "$GITHUB_OUTPUT"
          echo 'deploy_components=[]' >> "$GITHUB_OUTPUT"
          echo 'check_components=[]' >> "$GITHUB_OUTPUT"
          echo 'agent_components=[]' >> "$GITHUB_OUTPUT"
          echo 'agent_infrastructure_only=false' >> "$GITHUB_OUTPUT"
          echo 'qualification_required=false' >> "$GITHUB_OUTPUT"
          echo 'reconcile_after_gate=false' >> "$GITHUB_OUTPUT"
          echo 'rotation_from_generation=' >> "$GITHUB_OUTPUT"
          echo 'rotation_to_generation=' >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref='${{ github.event.pull_request.base.sha }}'
            candidate='${{ github.event.pull_request.head.sha }}'
            base="$(git merge-base "$base_ref" "$candidate")"
          else
            base='${{ github.event.before }}'
            candidate="$GITHUB_SHA"
            if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
              base="$(git rev-list --max-parents=0 "$candidate" | tail -n 1)"
            fi
          fi
          components="$(node scripts/affected-stacks.mjs "$base" "$candidate")"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          check_components="$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).filter((component) => component !== "agent"))' "$components")"
          agent_components="$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).filter((component) => component === "agent"))' "$components")"
          echo "check_components=$check_components" >> "$GITHUB_OUTPUT"
          echo "agent_components=$agent_components" >> "$GITHUB_OUTPUT"
          agent_infrastructure_only="$(node scripts/affected-stacks.mjs "$base" "$candidate" --agent-infrastructure-only)"
          if [[ "$agent_infrastructure_only" == true && "$components" == *'"agent"'* ]]; then
            deploy_components='["agent"]'
            echo 'qualification_required=false' >> "$GITHUB_OUTPUT"
            echo 'reconcile_after_gate=false' >> "$GITHUB_OUTPUT"
          else
            deploy_components="$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).filter((component) => component !== "agent"))' "$components")"
            qualification_required="$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).includes("agent"))' "$components")"
            echo "qualification_required=$qualification_required" >> "$GITHUB_OUTPUT"
            echo "reconcile_after_gate=$qualification_required" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_components=$deploy_components" >> "$GITHUB_OUTPUT"
          echo "agent_infrastructure_only=$agent_infrastructure_only" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.component }}
    needs: route
    if: >-
      needs.route.outputs.check_components != '[]' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo-deploy')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.route.outputs.check_components) }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          npm ci
      - name: Run the selected check
        run: npm run check -- ${{ matrix.component }}
      - name: Verify component routing
        run: node --test tests/phase0-routing.test.mjs tests/phase12-demo-deploy-routing.test.mjs
      - name: Check presenter interface copy
        run: node --test tests/presenter-ui-copy.test.mjs
      - name: Run app release acceptance checks
        if: matrix.component == 'app'
        run: |
          node --test tests/phase1-deploy.test.mjs tests/phase1-checkout-handler.test.mjs tests/phase3-inventory-version-preparation.test.mjs tests/phase5-inventory-memory-preparation.test.mjs tests/phase10-app-throttle.test.mjs
          node --test --test-name-pattern="^app " tests/phase3-inventory-denial-infrastructure.test.mjs
          python -m unittest discover -s tests -p 'phase4_release_bindings_test.py' -k app
      - name: Run controller release acceptance checks
        if: matrix.component == 'controller'
        run: |
          # The infrastructure suites validate table and SKU bindings from the synthesized app outputs.
          npm run check -- app
          node --test tests/phase2-controller-deploy.test.mjs tests/phase2-controller-handler.test.mjs tests/phase3-inventory-denial-controller.test.mjs tests/phase5-inventory-memory-controller.test.mjs
          # The Phase 6 infrastructure suite also checks Phase 9 capacity baseline and IAM grants.
          node --test tests/phase6-controller-recovery.test.mjs tests/phase6-controller-recovery-display.test.mjs tests/phase6-controller-recovery-infrastructure.test.mjs tests/phase7-controller-request-limits.test.mjs tests/phase8-controller-reset.test.mjs tests/phase8-controller-reset-infrastructure.test.mjs
          node --test tests/phase9-controller-capacity.test.mjs
          node --test tests/phase10-controller-surge.test.mjs tests/phase10-controller-metrics.test.mjs tests/phase10-controller-infrastructure.test.mjs
          node --test tests/phase-riv2026-domains-bootstrap-policy.test.mjs
          node --test tests/phase11-controller-credential-rotation.test.mjs
          node --test --test-name-pattern="^controller evidence" tests/phase3-inventory-denial-infrastructure.test.mjs
          node --test tests/phase4-agent-controller.test.mjs
          node --test --test-name-pattern="^controller can read" tests/phase4-agent-infrastructure.test.mjs
          python -m unittest discover -s tests -p 'phase4_release_bindings_test.py' -k controller
      - name: Save the checked assembly for the serialized preflight
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/demo-deploy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-${{ matrix.component }}-${{ github.sha }}
          path: .artifacts/${{ matrix.component }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0

  check-agent:
    name: Check agent (ARM64)
    needs: route
    if: >-
      needs.route.outputs.agent_components != '[]' &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo-deploy')))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --project agent --locked
      - name: Run the selected check
        run: npm run check -- agent
      - name: Verify component routing
        run: node --test tests/phase0-routing.test.mjs tests/phase12-demo-deploy-routing.test.mjs
      - name: Run Phase 19 reference routing checks
        run: |
          npm run check -- app
          node --test tests/phase19-reference-routing.test.mjs
      - name: Run agent runtime and release acceptance checks
        run: |
          uv run --project agent --locked python -m unittest discover -s tests -p 'phase4_*_test.py'
          uv run --project agent --locked python -m unittest discover -s tests -p 'phase10_agent_capacity_evidence_test.py'
          uv run --project agent --locked python -m unittest discover -s tests -p 'phase13_*_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase14_*_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase15_deterministic_checks_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase16_*_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase17_*_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase18_*_test.py'
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase19_*_test.py'
          node --test --test-name-pattern="^(agent stack|adapter only)" tests/phase4-agent-infrastructure.test.mjs
          node --test tests/phase4-agent-release.test.mjs tests/phase4-agent-model-seed.test.mjs
          node --test tests/phase19-agent-migration.test.mjs
          node --test tests/phase20-gate-routing.test.mjs
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase20_*_test.py'
      - name: Verify controller selection through the alarm adapter
        run: |
          npm run check -- controller
          node --test tests/phase21-*.test.mjs
          uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase21_*_test.py'
      - name: Run Phase 22 stage and session acceptance checks
        run: uv run --offline --project agent --locked python -m unittest discover -s tests -p 'phase22_*_test.py'
      - name: Run Phase 22 publication binding checks
        run: node --import tsx --test tests/verify-talk-publication.test.mjs
      - name: Run the locked native ARM64 smoke command
        run: uv run --project agent --locked python agent/native_smoke.py .artifacts/agent/runtime.zip
      - name: Save the checked agent assembly for the serialized preflight
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/demo-deploy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase0-agent-${{ github.sha }}
          path: .artifacts/agent
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
      - name: Save the checked agent ZIP for credential-free archive review
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-runtime-${{ github.sha }}
          path: .artifacts/agent/runtime.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy ${{ matrix.component }}
    needs: [route, check, check-agent, audience-case-gate]
    if: >-
      always() && !cancelled() && needs.route.result == 'success' &&
      (needs.route.outputs.qualification_required != 'true' || needs.audience-case-gate.result == 'success') &&
      ((needs.route.outputs.deploy_components == '["agent"]' && needs.check-agent.result == 'success') ||
      (needs.route.outputs.deploy_components != '["agent"]' && needs.check.result == 'success')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/demo-deploy' &&
      needs.route.outputs.deploy_components != '[]'
    runs-on: ubuntu-24.04
    environment: demo-infrastructure
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.route.outputs.deploy_components) }}
    concurrency:
      group: incident-triage-demo-${{ matrix.component }}
      cancel-in-progress: false
    steps:
      - name: Check out workflow tests and helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download the checked assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase0-${{ matrix.component }}-${{ github.sha }}
          path: .artifacts/${{ matrix.component }}
      - name: Confirm checked assembly
        run: test -s .artifacts/${{ matrix.component }}/cdk/manifest.json
      - name: Confirm checked agent ZIP
        if: matrix.component == 'agent'
        run: test -s .artifacts/agent/runtime.zip
      - name: Set up Node.js for the component deploy CLI
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned deploy CLI
        run: npm ci --ignore-scripts
      - name: Resolve the checked agent file asset
        if: matrix.component == 'agent' && needs.route.outputs.operation != 'reference-setup' && needs.route.outputs.agent_infrastructure_only != 'true'
        id: asset
        shell: bash
        env:
          EXPECTED_BUCKET: ${{ env.PHASE0_ASSET_BUCKET }}
        run: |
          set -euo pipefail
          node scripts/phase0-agent-asset.mjs .artifacts/agent/cdk .artifacts/agent/runtime.zip "$EXPECTED_BUCKET" > "$RUNNER_TEMP/phase0-agent-asset.json"
          cat "$RUNNER_TEMP/phase0-agent-asset.json"
          echo "bucket=$(jq -r .bucketName "$RUNNER_TEMP/phase0-agent-asset.json")" >> "$GITHUB_OUTPUT"
          echo "key=$(jq -r .objectKey "$RUNNER_TEMP/phase0-agent-asset.json")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .runtimeSha256 "$RUNNER_TEMP/phase0-agent-asset.json")" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r .runtimePath "$RUNNER_TEMP/phase0-agent-asset.json")" >> "$GITHUB_OUTPUT"
      - name: Verify the allowed OIDC case
        env:
          PHASE0_OIDC_CASE: allowed
          PHASE0_OIDC_ROLE_ARN: ${{ env.PHASE0_DEPLOY_ROLE_ARN }}
          PHASE0_OIDC_ENVIRONMENT: demo-infrastructure
        run: node --test tests/phase0-oidc.test.mjs
      - name: Assume the GitHub deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE0_DEPLOY_ROLE_ARN }}
          role-session-name: phase0-github-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify the GitHub deployment identity
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/IncidentTriageDemoGitHubDeploy/*) ;;
            *) echo "Unexpected deployment caller: $caller" >&2; exit 1 ;;
          esac
          echo "Verified GitHub deployment identity: $caller"
      - name: Verify the selected CDK bootstrap path
        shell: bash
        run: |
          set -euo pipefail
          # Keep this role chain in a subshell. Standard CDK bootstrap roles
          # are independently trusted by the GitHub role, not by one another.
          (
            policy='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudformation:DescribeStacks","cloudformation:ListStackResources","ssm:GetParameter"],"Resource":["arn:aws:cloudformation:us-east-1:027224425948:stack/IncidentTriageDemoBootstrap/*","arn:aws:ssm:us-east-1:027224425948:parameter/cdk-bootstrap/evaltalk/version"]}]}'
            credentials="$(aws sts assume-role --role-arn "$CDK_DEPLOY_ROLE_ARN" --role-session-name phase0-bootstrap-${{ matrix.component }}-${GITHUB_RUN_ID} --duration-seconds 900 --policy "$policy" --query Credentials --output json)"
            export AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$credentials")"
            export AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$credentials")"
            export AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$credentials")"
            caller="$(aws sts get-caller-identity --query Arn --output text)"
            case "$caller" in
              arn:aws:sts::027224425948:assumed-role/cdk-evaltalk-deploy-role-027224425948-us-east-1/*) ;;
              *) echo "Unexpected bootstrap caller: $caller" >&2; exit 1 ;;
            esac
            status="$(aws cloudformation describe-stacks --stack-name "$PHASE0_CDK_BOOTSTRAP_STACK" --query 'Stacks[0].StackStatus' --output text)"
            [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE ]]
            resources="$(aws cloudformation list-stack-resources --stack-name "$PHASE0_CDK_BOOTSTRAP_STACK" --query 'StackResourceSummaries[?PhysicalResourceId==`cdk-evaltalk-deploy-role-027224425948-us-east-1` || PhysicalResourceId==`cdk-evaltalk-file-publishing-role-027224425948-us-east-1` || PhysicalResourceId==`cdk-evaltalk-cfn-exec-role-027224425948-us-east-1`].PhysicalResourceId' --output text)"
            for role in cdk-evaltalk-deploy-role-027224425948-us-east-1 cdk-evaltalk-file-publishing-role-027224425948-us-east-1 cdk-evaltalk-cfn-exec-role-027224425948-us-east-1; do
              grep -F "$role" <<<"$resources" >/dev/null
            done
            version="$(aws ssm get-parameter --name /cdk-bootstrap/evaltalk/version --query 'Parameter.Value' --output text)"
            [[ "$version" =~ ^[0-9]+$ && "$version" -gt 0 ]]
            echo "Verified bootstrap identity: $caller; stack=$PHASE0_CDK_BOOTSTRAP_STACK status=$status version=$version"
          )
      - name: Check agent publisher ownership before candidate asset publication
        if: matrix.component == 'agent' && needs.route.outputs.operation != 'reference-setup' && needs.route.outputs.agent_infrastructure_only != 'true'
        id: agent_ownership
        shell: bash
        env:
          AGENT_DEPLOY_ROLE_ARN: ${{ env.CDK_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          (
            stack_arn="arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${PHASE0_AGENT_STACK}/*"
            ownership_policy="$(jq -cn --arg stack "$stack_arn" '{Version:"2012-10-17",Statement:[
              {Effect:"Allow",Action:["cloudformation:DescribeStacks","cloudformation:ListStackResources"],Resource:$stack},
              {Effect:"Allow",Action:"sts:GetCallerIdentity",Resource:"*"}
            ]}')"
            credentials="$(aws sts assume-role --role-arn "$AGENT_DEPLOY_ROLE_ARN" \
              --role-session-name "phase19-agent-ownership-${GITHUB_RUN_ID}" --duration-seconds 900 \
              --policy "$ownership_policy" --query Credentials --output json)"
            export AWS_ACCESS_KEY_ID="$(jq -er .AccessKeyId <<<"$credentials")"
            export AWS_SECRET_ACCESS_KEY="$(jq -er .SecretAccessKey <<<"$credentials")"
            export AWS_SESSION_TOKEN="$(jq -er .SessionToken <<<"$credentials")"
            unset credentials ownership_policy
            caller="$(aws sts get-caller-identity --query Arn --output text)"
            case "$caller" in
              arn:aws:sts::027224425948:assumed-role/cdk-evaltalk-deploy-role-027224425948-us-east-1/*) ;;
              *) echo "Unexpected agent ownership caller: $caller" >&2; exit 1 ;;
            esac
            error_file="$RUNNER_TEMP/agent-ownership.error"
            if ! stack_state="$(aws cloudformation describe-stacks --stack-name "$PHASE0_AGENT_STACK" --output json 2>"$error_file")"; then
              if grep -Eqi 'does not exist|not exist|ValidationError' "$error_file"; then
                echo 'deferred=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              cat "$error_file" >&2
              exit 1
            fi
            resources="$(aws cloudformation list-stack-resources --stack-name "$PHASE0_AGENT_STACK" --output json)"
            legacy_count="$(jq '[.StackResourceSummaries[]? | select(.LogicalResourceId == "FaultyEndpoint" and .ResourceType == "AWS::BedrockAgentCore::RuntimeEndpoint")] | length' <<<"$resources")"
            if [[ "$legacy_count" -gt 0 ]]; then
              legacy="$(jq -r '.StackResourceSummaries[]? | select(.LogicalResourceId == "FaultyEndpoint" and .ResourceType == "AWS::BedrockAgentCore::RuntimeEndpoint") | .PhysicalResourceId // "unknown"' <<<"$resources")"
              echo "Agent publisher still owns legacy endpoint; deferring candidate asset publication: $legacy"
              echo 'deferred=true' >> "$GITHUB_OUTPUT"
            else
              echo 'deferred=false' >> "$GITHUB_OUTPUT"
            fi
          )
      - name: Publish and verify the checked agent file asset
        if: matrix.component == 'agent' && needs.route.outputs.operation != 'reference-setup' && needs.route.outputs.agent_infrastructure_only != 'true' && steps.agent_ownership.outputs.deferred != 'true'
        shell: bash
        env:
          ASSET_BUCKET: ${{ steps.asset.outputs.bucket }}
          ASSET_KEY: ${{ steps.asset.outputs.key }}
          ASSET_SHA256: ${{ steps.asset.outputs.sha256 }}
          ASSET_RUNTIME: ${{ steps.asset.outputs.runtime }}
        run: |
          set -euo pipefail
          # This step still has the original GitHub-role credentials: the
          # bootstrap deploy-role probe was isolated in the prior step.
          file_policy="$(jq -cn --arg bucket "$ASSET_BUCKET" --arg key "$ASSET_KEY" '{Version:"2012-10-17",Statement:[{Effect:"Allow",Action:["s3:GetBucketLocation","s3:ListBucket"],Resource:("arn:aws:s3:::" + $bucket)},{Effect:"Allow",Action:["s3:GetObject","s3:GetObjectVersion","s3:PutObject"],Resource:("arn:aws:s3:::" + $bucket + "/" + $key)},{Effect:"Allow",Action:["kms:GenerateDataKey","kms:Decrypt"],Resource:"*",Condition:{StringEquals:{"kms:ViaService":"s3.us-east-1.amazonaws.com"},ArnEquals:{"kms:EncryptionContext:aws:s3:arn":("arn:aws:s3:::" + $bucket + "/" + $key)}}}]}')"
          file_credentials="$(aws sts assume-role --role-arn "$CDK_FILE_PUBLISHING_ROLE_ARN" --role-session-name phase0-file-agent-${GITHUB_RUN_ID} --duration-seconds 900 --policy "$file_policy" --query Credentials --output json)"
          export AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$file_credentials")"
          export AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$file_credentials")"
          export AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$file_credentials")"
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/cdk-evaltalk-file-publishing-role-027224425948-us-east-1/*) ;;
            *) echo "Unexpected file-publishing caller: $caller" >&2; exit 1 ;;
          esac

          head_error="$RUNNER_TEMP/phase0-head-error"
          uploaded=false
          if head_json="$(aws s3api head-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --expected-bucket-owner "$AWS_ACCOUNT_ID" 2>"$head_error")"; then
            version_id="$(jq -r '.VersionId // "unversioned"' <<<"$head_json")"
            get_args=(s3api get-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --expected-bucket-owner "$AWS_ACCOUNT_ID")
            [[ "$version_id" == unversioned ]] || get_args+=(--version-id "$version_id")
            get_args+=("$RUNNER_TEMP/phase0-agent-existing.zip")
            aws "${get_args[@]}" >/dev/null
            existing_sha="$(sha256sum "$RUNNER_TEMP/phase0-agent-existing.zip" | awk '{print $1}')"
            test "$existing_sha" = "$ASSET_SHA256" || { echo "Refusing to overwrite a different CDK asset object" >&2; exit 1; }
          else
            if ! grep -Eq '404|NotFound|NoSuchKey' "$head_error"; then
              cat "$head_error" >&2
              exit 1
            fi
            put_json="$(aws s3api put-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --body "$ASSET_RUNTIME" --if-none-match '*' --expected-bucket-owner "$AWS_ACCOUNT_ID")"
            uploaded=true
            version_id="$(jq -r '.VersionId // "unversioned"' <<<"$put_json")"
            echo "Uploaded new agent asset version: bucket=$ASSET_BUCKET key=$ASSET_KEY version_id=$version_id"
            if [[ "$version_id" == unversioned ]]; then
              head_json="$(aws s3api head-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --expected-bucket-owner "$AWS_ACCOUNT_ID")"
            else
              head_json="$(aws s3api head-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --version-id "$version_id" --expected-bucket-owner "$AWS_ACCOUNT_ID")"
            fi
          fi
          get_args=(s3api get-object --bucket "$ASSET_BUCKET" --key "$ASSET_KEY" --expected-bucket-owner "$AWS_ACCOUNT_ID")
          [[ "$version_id" == unversioned ]] || get_args+=(--version-id "$version_id")
          get_args+=("$RUNNER_TEMP/phase0-agent-runtime-verified.zip")
          aws "${get_args[@]}" >/dev/null
          downloaded_sha="$(sha256sum "$RUNNER_TEMP/phase0-agent-runtime-verified.zip" | awk '{print $1}')"
          test "$downloaded_sha" = "$ASSET_SHA256"
          size="$(jq -r .ContentLength <<<"$head_json")"
          echo "Verified agent asset bytes: bucket=$ASSET_BUCKET key=$ASSET_KEY sha256=$downloaded_sha bytes=$size version_id=$version_id uploaded=$uploaded"

      - name: Deploy the checked app assembly
        if: matrix.component == 'app'
        shell: bash
        env:
          APP_PRESENTER_DIGEST: ${{ secrets.APP_PRESENTER_DIGEST }}
          APP_ALARM_ADAPTER_ARN: ${{ vars.APP_ALARM_ADAPTER_ARN }}
          APP_ROTATION_FROM_GENERATION: ${{ needs.route.outputs.rotation_from_generation }}
          APP_ROTATION_TO_GENERATION: ${{ needs.route.outputs.rotation_to_generation }}
          PUSH_BASE: ${{ github.event.before }}
        run: bash scripts/deploy-app.sh

      - name: Deploy the checked controller assembly
        if: matrix.component == 'controller'
        shell: bash
        env:
          CONTROLLER_OPERATOR_SECRET_ARN: ${{ vars.CONTROLLER_OPERATOR_SECRET_ARN }}
          CONTROLLER_APP_SECRET_ARN: ${{ vars.CONTROLLER_APP_SECRET_ARN }}
          CONTROLLER_AGENT_RUNTIME_ARN: ${{ vars.CONTROLLER_AGENT_RUNTIME_ARN }}
          CONTROLLER_AGENT_ENDPOINT_ARN: ${{ vars.CONTROLLER_AGENT_ENDPOINT_ARN }}
          CONTROLLER_AGENT_ALARM_ADAPTER_ARN: ${{ vars.CONTROLLER_AGENT_ALARM_ADAPTER_ARN }}
          PUSH_BASE: ${{ github.event.before }}
        run: bash scripts/deploy-controller.sh

      - name: Set up Python for native agent finalization
        if: matrix.component == 'agent'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up uv for native agent finalization
        if: matrix.component == 'agent'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - name: Install locked Python for fixed reference maintenance
        if: matrix.component == 'agent' && needs.route.outputs.operation == 'reference-setup'
        run: uv sync --project agent --locked
      - name: Bootstrap the fixed reference stack from its reviewed archive
        if: matrix.component == 'agent' && needs.route.outputs.operation == 'reference-setup' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/demo-deploy'
        shell: bash
        run: |
          set -euo pipefail
          fixed_bucket="$(jq -er '.artifact.bucket' scripts/faulty-reference.json)"
          fixed_key="$(jq -er '.artifact.key' scripts/faulty-reference.json)"
          fixed_revision="$(jq -er '.sourceRevision' scripts/faulty-reference.json)"
          fixed_digest="$(jq -er '.artifact.sha256' scripts/faulty-reference.json)"
          PHASE20_AGENT_INFRASTRUCTURE_ONLY=true \
          PHASE20_FIXED_BOOTSTRAP=true \
          PHASE20_FIXED_RUNTIME_BUCKET="$fixed_bucket" \
          PHASE20_FIXED_RUNTIME_KEY="$fixed_key" \
          PHASE20_FIXED_RUNTIME_REVISION="$fixed_revision" \
          PHASE20_FIXED_RUNTIME_SHA256="$fixed_digest" \
            bash scripts/deploy-agent.sh
      - name: Deploy and finalize the checked agent assembly
        if: matrix.component == 'agent' && needs.route.outputs.operation != 'reference-setup'
        env:
          PHASE20_AGENT_INFRASTRUCTURE_ONLY: ${{ needs.route.outputs.agent_infrastructure_only }}
        run: bash scripts/deploy-agent.sh
      - name: Set up the fixed faulty reference
        if: matrix.component == 'agent' && needs.route.outputs.operation == 'reference-setup' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/demo-deploy'
        shell: bash
        env:
          REFERENCE_DEPLOY_ROLE_ARN: ${{ env.CDK_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          (
            stack_arn="arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${PHASE0_AGENT_STACK}/*"
            change_set_arn="arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/*/*"
            runtime_arn="arn:aws:bedrock-agentcore:${AWS_REGION}:${AWS_ACCOUNT_ID}:runtime/IncidentTriageDemoAgent-??????????"
            endpoint_arn="${runtime_arn}/runtime-endpoint/faulty"
            endpoint_collection_arn="${runtime_arn}/runtime-endpoint/*"
            adapter_arn="arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:IncidentTriageDemoAlarmAdapter"
            table_arn="arn:aws:dynamodb:${AWS_REGION}:${AWS_ACCOUNT_ID}:table/IncidentTriageDemoControllerRun"
            bucket_arn="arn:aws:s3:::${PHASE0_ASSET_BUCKET}"
            reference_objects="${bucket_arn}/agent-reference/*"
            runtime_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/IncidentTriageDemoAgentRuntimeRole"
            lambda_key_arn="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:key/9d894f12-dc33-4332-bb3e-df489928914b"
            bootstrap_key_arn="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:key/b292b95c-709f-42c6-aa42-b934ba2c6f07"
            table_key_arn="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:key/2a020640-e95b-4bec-8ae7-3f6d9fcb8e0d"
            reference_policy="$(jq -cn \
              --arg stack "$stack_arn" \
              --arg changeset "$change_set_arn" \
              --arg runtime "$runtime_arn" \
              --arg endpoint "$endpoint_arn" \
              --arg endpoint_collection "$endpoint_collection_arn" \
              --arg adapter "$adapter_arn" \
              --arg table "$table_arn" \
              --arg objects "$reference_objects" \
              --arg runtime_role "$runtime_role_arn" \
              --arg lambda_key "$lambda_key_arn" \
              --arg bootstrap_key "$bootstrap_key_arn" \
              --arg table_key "$table_key_arn" \
              '{Version:"2012-10-17",Statement:[
                {Effect:"Allow",Action:["cloudformation:DescribeStacks","cloudformation:ListStackResources","cloudformation:GetTemplate","cloudformation:DescribeChangeSet","cloudformation:CreateChangeSet","cloudformation:ExecuteChangeSet"],Resource:[$stack,$changeset]},
                {Effect:"Allow",Action:["s3:GetObject","s3:GetObjectVersion"],Resource:$objects},
                {Effect:"Allow",Action:["bedrock-agentcore:GetAgentRuntime*","bedrock-agentcore:UpdateAgentRuntime*","bedrock-agentcore:CreateAgentRuntimeEndpoint"],Resource:[$runtime,$endpoint]},
                {Effect:"Allow",Action:"bedrock-agentcore:CreateAgentRuntimeEndpoint",Resource:$endpoint_collection},
                {Effect:"Allow",Action:"bedrock-agentcore:ListAgentRuntimeVersions",Resource:"*"},
                {Effect:"Allow",Action:["lambda:GetFunctionConfiguration","lambda:UpdateFunctionConfiguration"],Resource:$adapter},
                {Effect:"Allow",Action:["dynamodb:GetItem","dynamodb:PutItem"],Resource:$table},
                {Effect:"Allow",Action:"iam:PassRole",Resource:$runtime_role},
                {Effect:"Allow",Action:["kms:Encrypt","kms:Decrypt"],Resource:[$lambda_key,$bootstrap_key,$table_key]}
              ]}')"
            if (( ${#reference_policy} >= 2048 )); then
              echo "reference session policy is ${#reference_policy} bytes; STS permits at most 2047" >&2
              exit 1
            fi
            credentials="$(aws sts assume-role --role-arn "$REFERENCE_DEPLOY_ROLE_ARN" \
              --role-session-name "phase19-reference-${GITHUB_RUN_ID}" --duration-seconds 3600 \
              --policy "$reference_policy" --query Credentials --output json)"
            export AWS_ACCESS_KEY_ID="$(jq -er .AccessKeyId <<<"$credentials")"
            export AWS_SECRET_ACCESS_KEY="$(jq -er .SecretAccessKey <<<"$credentials")"
            export AWS_SESSION_TOKEN="$(jq -er .SessionToken <<<"$credentials")"
            unset credentials reference_policy
            caller="$(aws sts get-caller-identity --query Arn --output text)"
            case "$caller" in
              arn:aws:sts::027224425948:assumed-role/cdk-evaltalk-deploy-role-027224425948-us-east-1/*) ;;
              *) echo "Unexpected reference-maintenance caller: $caller" >&2; exit 1 ;;
            esac

            reference_preflight="$RUNNER_TEMP/agent-reference-preflight.json"
            uv run --offline --project agent --locked python scripts/setup-faulty-reference.py preflight > "$reference_preflight"
            cat "$reference_preflight"
            jq -e '.status == "ready" or .status == "partial" or .status == "already_detached"' "$reference_preflight" >/dev/null

            plan="$RUNNER_TEMP/agent-reference-cutover.json"
            preflight="$RUNNER_TEMP/agent-reference-cutover-preflight.json"
            uv run --offline --project agent --locked python scripts/retire-agent-endpoint.py prepare --plan "$plan" > "$preflight"
            cat "$preflight"
            case "$(jq -er .status "$preflight")" in
              prepared)
                uv run --offline --project agent --locked python scripts/retire-agent-endpoint.py execute --plan "$plan"
                ;;
              already_detached)
                echo "Agent endpoint ownership was already detached; no migration change set was executed."
                ;;
              *)
                echo "Unexpected agent endpoint cutover status" >&2
                exit 1
                ;;
            esac
            uv run --offline --project agent --locked python scripts/setup-faulty-reference.py
          )

  evaluate-agent:
    name: Qualify checked repaired agent
    needs: [route, check-agent, audience-case-gate]
    outputs:
      qualification_sha256: ${{ steps.receipt.outputs.qualification_sha256 }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact_sha256 }}
      qualification_key: ${{ steps.receipt.outputs.qualification_key }}
      review_manifest_sha256: ${{ steps.receipt.outputs.review_manifest_sha256 }}
      evaluation_run_id: ${{ github.run_id }}
      evaluation_run_attempt: ${{ github.run_attempt }}
    if: >-
      needs.route.result == 'success' && needs.check-agent.result == 'success' &&
      needs.audience-case-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/demo-deploy' &&
      needs.route.outputs.operation == 'normal' &&
      needs.route.outputs.qualification_required == 'true'
    runs-on: ubuntu-24.04-arm
    environment: demo-evaluation
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: incident-triage-demo-agent-qualification
      cancel-in-progress: false
    steps:
      - name: Check out evaluation driver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download the checked agent assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase0-agent-${{ github.sha }}
          path: .artifacts/agent
      - name: Verify the checked ZIP before evaluation credentials
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s .artifacts/agent/runtime.zip
          unzip -tq .artifacts/agent/runtime.zip
          artifact_sha256="$(sha256sum .artifacts/agent/runtime.zip | awk '{print $1}')"
          test "${#artifact_sha256}" -eq 64
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "Checked ARM64 Runtime ZIP: sha256=$artifact_sha256"
      - name: Set up Python and uv
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install the locked evaluation driver
        run: uv sync --project agent --locked
      - name: Verify the evaluation OIDC case
        env:
          PHASE0_OIDC_CASE: allowed
          PHASE0_OIDC_ROLE_ARN: ${{ env.PHASE20_EVALUATION_ROLE_ARN }}
          PHASE0_OIDC_ENVIRONMENT: demo-evaluation
          PHASE0_DENIED_OIDC_ROLE_ARNS: ${{ env.PHASE0_DEPLOY_ROLE_ARN }},${{ env.PHASE20_PUBLISHER_ROLE_ARN }}
        run: node --test tests/phase0-oidc.test.mjs
      - name: Assume the scoped evaluation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE20_EVALUATION_ROLE_ARN }}
          role-session-name: phase20-evaluation-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify the scoped evaluation identity
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/IncidentTriageDemoGitHubEvaluation/*) ;;
            *) echo "Unexpected evaluation caller: $caller" >&2; exit 1 ;;
          esac
          echo "Verified evaluation identity: $caller"
      - name: Verify evaluation role boundaries with short-lived STS probes
        shell: bash
        env:
          DENIED_LEGACY_ROLE_ARN: ${{ env.PHASE0_DEPLOY_ROLE_ARN }}
          DENIED_REPAIRED_ROLE_ARN: ${{ env.PHASE20_PUBLISHER_ROLE_ARN }}
        run: |
          set -euo pipefail
          for role_arn in "$DENIED_LEGACY_ROLE_ARN" "$DENIED_REPAIRED_ROLE_ARN"; do
            error_file="$RUNNER_TEMP/phase20-denied-sts-$RANDOM.error"
            set +e
            aws sts assume-role --role-arn "$role_arn" --role-session-name phase20-denied-probe --duration-seconds 900 >/dev/null 2>"$error_file"
            probe_status=$?
            set -e
            if [[ "$probe_status" -eq 0 ]]; then
              echo 'Evaluation role unexpectedly assumed a publishing role' >&2
              exit 1
            fi
            grep -Eqi 'AccessDenied|not authorized|not permitted' "$error_file" || {
              echo 'Evaluation role denial probe returned an unexpected STS failure' >&2
              exit 1
            }
          done
          echo 'Verified evaluation role: reviewed evaluator read allowed; legacy and repaired publisher role assumptions denied'
      - name: Retrieve and verify the frozen private evaluation inputs
        id: inputs
        shell: bash
        env:
          INPUT_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          INPUT_POINTER: ${{ github.workspace }}/agent/qualification-input.json
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/phase20-inputs"
          mkdir -p "$input_root"
          test -s "$INPUT_POINTER"
          pointer_bucket="$(jq -er '.bucket' "$INPUT_POINTER")"
          [[ "$pointer_bucket" == "$INPUT_BUCKET" ]] || { echo "qualification pointer bucket is outside the fixed evidence bucket" >&2; exit 1; }
          INPUT_KEY="$(jq -er '.s3Key' "$INPUT_POINTER")"
          INPUT_SHA256="$(jq -er '.sha256' "$INPUT_POINTER")"
          EXPECTED_SUITE_SHA256="$(jq -er '.suiteSha256' "$INPUT_POINTER")"
          EXPECTED_EVALUATOR_SHA256="$(jq -er '.evaluatorSha256' "$INPUT_POINTER")"
          [[ "$INPUT_KEY" =~ ^agent-evaluation/phase[0-9]+/inputs/[0-9a-f]{64}/staging\.tar\.gz$ ]]
          [[ "$INPUT_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SUITE_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_EVALUATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          aws s3api get-object --bucket "$INPUT_BUCKET" --key "$INPUT_KEY" --checksum-mode ENABLED "$input_root/staging.tar.gz" > "$input_root/get-object.json"
          printf '%s  %s\n' "$INPUT_SHA256" "$input_root/staging.tar.gz" | sha256sum -c -
          tar -xzf "$input_root/staging.tar.gz" -C "$input_root"
          test -s "$input_root/staging/suite.json"
          test -s "$input_root/staging/evaluator.json"
          printf '%s  %s\n' "$EXPECTED_SUITE_SHA256" "$input_root/staging/suite.json" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_EVALUATOR_SHA256" "$input_root/staging/evaluator.json" | sha256sum -c -
          evaluator_id="$(jq -er '.evaluatorId' "$input_root/staging/evaluator.json")"
          EVALUATOR_ID="$evaluator_id" EVALUATOR_DESCRIPTOR="$input_root/staging/evaluator.json" \
            PYTHONPATH=agent uv run --offline --project agent --locked python - <<'PY'
          import json
          import os
          import boto3

          descriptor = json.loads(open(os.environ["EVALUATOR_DESCRIPTOR"], encoding="utf-8").read())
          response = boto3.Session(region_name="us-east-1").client("bedrock-agentcore-control").get_evaluator(
              evaluatorId=os.environ["EVALUATOR_ID"], includedData="ALL_DATA"
          )
          evaluator = response.get("evaluator", response)
          if evaluator.get("evaluatorId") != descriptor.get("evaluatorId") or evaluator.get("status") != "ACTIVE":
              raise SystemExit("remote evaluator authorization/readback is not the reviewed active evaluator")
          PY
          echo "suite=$input_root/staging/suite.json" >> "$GITHUB_OUTPUT"
          echo "evaluator=$input_root/staging/evaluator.json" >> "$GITHUB_OUTPUT"
          echo "input_sha256=$INPUT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Stage immutable package and serving descriptors
        id: serving_inputs
        shell: bash
        env:
          INPUT_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          ALARM_ARN: ${{ env.PHASE20_ALARM_ARN }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          stage_prefix="agent-evaluation/phase20/$ARTIFACT_SHA256"
          stage_root="$RUNNER_TEMP/phase20-serving-inputs"
          mkdir -p "$stage_root"

          put_immutable() {
            local key="$1" body="$2" response version
            if response="$(aws s3api put-object --bucket "$INPUT_BUCKET" --key "$key" --body "$body" --if-none-match '*' --server-side-encryption AES256 2>"$stage_root/put-error")"; then
              version="$(jq -r '.VersionId // empty' <<<"$response")"
            elif grep -Eqi 'Precondition|412|already exists|ConditionalRequest' "$stage_root/put-error"; then
              version="$(aws s3api head-object --bucket "$INPUT_BUCKET" --key "$key" --query VersionId --output text)"
              case "$version" in None|null|'') version='' ;; esac
            else
              cat "$stage_root/put-error" >&2
              return 1
            fi
            readback="$stage_root/$(basename "$key").readback"
            if [[ -n "$version" ]]; then
              aws s3api get-object --bucket "$INPUT_BUCKET" --key "$key" --version-id "$version" "$readback" >/dev/null
            else
              aws s3api get-object --bucket "$INPUT_BUCKET" --key "$key" "$readback" >/dev/null
            fi
            expected_sha256="$(sha256sum "$body" | awk '{print $1}')"
            actual_sha256="$(sha256sum "$readback" | awk '{print $1}')"
            [[ "$actual_sha256" == "$expected_sha256" ]] || {
              echo "staged object bytes differ from the checked input: s3://$INPUT_BUCKET/$key" >&2
              return 1
            }
            printf '%s' "$version"
          }

          artifact_key="$stage_prefix/runtime.zip"
          packaged_revision="$(unzip -p .artifacts/agent/runtime.zip agent-manifest.json | jq -er '.sourceRevision')"
          [[ "$packaged_revision" == "$SOURCE_REVISION" ]] || {
            echo 'checked Runtime ZIP source revision differs from the GitHub source revision' >&2
            exit 1
          }
          artifact_version="$(put_immutable "$artifact_key" .artifacts/agent/runtime.zip)"
          unzip -p .artifacts/agent/runtime.zip prompt.py > "$stage_root/prompt.py"
          prompt_sha256="$(sha256sum "$stage_root/prompt.py" | awk '{print $1}')"
          source_key="$stage_prefix/prompt.py"
          source_version="$(put_immutable "$source_key" "$stage_root/prompt.py")"

          # The fixed serving configuration and adapter identity are reviewed
          # repository inputs. The evaluation role has no stack/Lambda/Runtime
          # mutation or discovery authority; the protected publisher performs
          # authoritative native readbacks before serving writes.
          jq -e '.runtimeConfiguration and .adapter and .controller' scripts/faulty-reference.json >/dev/null
          jq --arg bucket "$INPUT_BUCKET" --arg key "$artifact_key" --arg version "$artifact_version" \
             --arg revision "$GITHUB_SHA" --arg digest "$ARTIFACT_SHA256" \
            '{agentRuntimeArtifact,roleArn,environmentVariables,networkConfiguration,protocolConfiguration,lifecycleConfiguration,metadataConfiguration} |
             .agentRuntimeArtifact.codeConfiguration.code.s3 = ({bucket:$bucket,prefix:$key} + (if $version == "" then {} else {versionId:$version} end)) |
             .environmentVariables.AGENT_CANDIDATE_ID = "repaired" |
             .environmentVariables.AGENT_ENDPOINT_NAME = "repaired" |
             .environmentVariables.AGENT_SOURCE_REVISION = $revision |
             .environmentVariables.AGENT_ARTIFACT_SHA256 = $digest' \
            <(jq '.runtimeConfiguration' scripts/faulty-reference.json) > "$stage_root/runtime-configuration.json"
          configuration_sha256="$(sha256sum "$stage_root/runtime-configuration.json" | awk '{print $1}')"
          configuration_key="$stage_prefix/runtime-configuration.json"
          configuration_version="$(put_immutable "$configuration_key" "$stage_root/runtime-configuration.json")"

          jq '.adapter | {functionArn,codeSha256,tracingMode}' scripts/faulty-reference.json > "$stage_root/adapter.json"
          jq '.controller | .pk="AGENT_PUBLICATION#repaired"' scripts/faulty-reference.json > "$stage_root/controller.json"

          artifact_spec="$(jq -cn --arg bucket "$INPUT_BUCKET" --arg key "$artifact_key" --arg version "$artifact_version" --arg digest "$ARTIFACT_SHA256" '{bucket:$bucket,key:$key,sha256:$digest} | if $version == "" then . else .versionId=$version end')"
          source_spec="$(jq -cn --arg bucket "$INPUT_BUCKET" --arg key "$source_key" --arg version "$source_version" --arg digest "$prompt_sha256" '{bucket:$bucket,key:$key,sha256:$digest} | if $version == "" then . else .versionId=$version end')"
          configuration_spec="$(jq -cn --arg bucket "$INPUT_BUCKET" --arg key "$configuration_key" --arg version "$configuration_version" --arg digest "$configuration_sha256" '{bucket:$bucket,key:$key,sha256:$digest} | if $version == "" then . else .versionId=$version end')"
          printf '%s\n' "$artifact_spec" > "$stage_root/artifact-spec.json"
          printf '%s\n' "$source_spec" > "$stage_root/source-spec.json"
          printf '%s\n' "$configuration_spec" > "$stage_root/configuration-spec.json"
          echo "artifact_spec=$stage_root/artifact-spec.json" >> "$GITHUB_OUTPUT"
          echo "source_spec=$stage_root/source-spec.json" >> "$GITHUB_OUTPUT"
          echo "configuration_spec=$stage_root/configuration-spec.json" >> "$GITHUB_OUTPUT"
          echo "runtime_configuration=$stage_root/runtime-configuration.json" >> "$GITHUB_OUTPUT"
          echo "adapter=$stage_root/adapter.json" >> "$GITHUB_OUTPUT"
          echo "controller=$stage_root/controller.json" >> "$GITHUB_OUTPUT"
          echo "artifact_key=$artifact_key" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
      - name: Run the checked package qualification
        id: qualification
        shell: bash
        env:
          SUITE_PATH: ${{ steps.inputs.outputs.suite }}
          EVALUATOR_PATH: ${{ steps.inputs.outputs.evaluator }}
          RUNTIME_ZIP: ${{ github.workspace }}/.artifacts/agent/runtime.zip
          QUALIFICATION_ROOT: ${{ runner.temp }}/phase20-qualification
          RUNTIME_CONFIGURATION: ${{ steps.serving_inputs.outputs.runtime_configuration }}
          ARTIFACT_SPEC: ${{ steps.serving_inputs.outputs.artifact_spec }}
          SOURCE_SPEC: ${{ steps.serving_inputs.outputs.source_spec }}
          CONFIGURATION_SPEC: ${{ steps.serving_inputs.outputs.configuration_spec }}
          ADAPTER_SPEC: ${{ steps.serving_inputs.outputs.adapter }}
          CONTROLLER_SPEC: ${{ steps.serving_inputs.outputs.controller }}
          EVIDENCE_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: agent-evaluation/phase20/${{ steps.artifact.outputs.artifact_sha256 }}
          ALARM_ARN: ${{ env.PHASE20_ALARM_ARN }}
          AGENT_OBSERVABILITY_ENABLED: 'true'
          AWS_GENAI_CONTENT_EXTRACTION_OPT_OUT: 'true'
          OTEL_TRACES_EXPORTER: otlp
          OTEL_TRACES_SAMPLER: always_on
          OTEL_PYTHON_DISTRO: aws_distro
          OTEL_PYTHON_CONFIGURATOR: aws_configurator
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://xray.us-east-1.amazonaws.com/v1/traces
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: x-aws-log-group=/aws/bedrock-agentcore/incident-triage-evaluation,x-aws-log-stream=spans
          OTEL_RESOURCE_ATTRIBUTES: service.name=IncidentTriageDemoPhase20Qualification,aws.log.group.names=/aws/bedrock-agentcore/incident-triage-evaluation
          OTEL_LOGS_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_SERVICE_NAME: IncidentTriageDemoPhase20Qualification
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_ROOT"
          # qualify-repaired is the only evaluation entry point. It owns
          # package-only imports, the frozen roster, private evidence upload,
          # native evaluator mapping, and the safe handoff receipt.
          set +e
          PYTHONPATH=agent uv run --offline --project agent --locked \
            opentelemetry-instrument python scripts/qualify-repaired.py \
            --runtime-zip "$RUNTIME_ZIP" --suite "$SUITE_PATH" --evaluator "$EVALUATOR_PATH" \
            --output-root "$QUALIFICATION_ROOT" --runtime-configuration "$RUNTIME_CONFIGURATION" \
            --artifact-spec "$ARTIFACT_SPEC" --source-spec "$SOURCE_SPEC" \
            --configuration-spec "$CONFIGURATION_SPEC" --adapter "$ADAPTER_SPEC" \
            --controller "$CONTROLLER_SPEC" \
            --source-revision "$GITHUB_SHA" --alarm-arn "$ALARM_ARN" \
            --bucket "$EVIDENCE_BUCKET" --prefix "$EVIDENCE_PREFIX" \
            > "$QUALIFICATION_ROOT/summary.json" 2> "$QUALIFICATION_ROOT/qualification.stderr.log"
          qualify_status=$?
          set -e
          receipt_path="$QUALIFICATION_ROOT/repaired-qualification.json"
          test -s "$receipt_path"
          jq -e '.artifact.sha256 and .source.sha256 and .configuration.sha256 and .reviewManifestSha256 and .servingArtifact.bucket and .servingArtifact.key' "$receipt_path" >/dev/null
          echo "qualification=$receipt_path" >> "$GITHUB_OUTPUT"
          echo "exit_status=$qualify_status" >> "$GITHUB_OUTPUT"
      - name: Preserve private qualification diagnostics
        if: >-
          always() && (steps.qualification.outcome == 'failure' ||
          steps.qualification.outputs.exit_status != '0')
        shell: bash
        env:
          EVIDENCE_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: agent-evaluation/phase20/${{ steps.artifact.outputs.artifact_sha256 }}
          QUALIFICATION_ROOT: ${{ runner.temp }}/phase20-qualification
        run: |
          set -euo pipefail
          for diagnostic in qualification.stderr.log summary.json; do
            diagnostic_path="$QUALIFICATION_ROOT/$diagnostic"
            [[ -s "$diagnostic_path" ]] || continue
            diagnostic_key="$EVIDENCE_PREFIX/diagnostics/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/$diagnostic"
            diagnostic_sha256="$(sha256sum "$diagnostic_path" | awk '{print $1}')"
            aws s3api put-object --bucket "$EVIDENCE_BUCKET" --key "$diagnostic_key" \
              --body "$diagnostic_path" --if-none-match '*' --server-side-encryption AES256 \
              --metadata "sha256=$diagnostic_sha256" --content-type text/plain >/dev/null
            echo "Private qualification diagnostic preserved: sha256=$diagnostic_sha256"
          done
      - name: Preserve private native experiment on crash without a receipt
        if: >-
          always() && steps.qualification.outcome == 'failure' &&
          steps.qualification.outputs.qualification == ''
        shell: bash
        env:
          EVIDENCE_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: agent-evaluation/phase20/${{ steps.artifact.outputs.artifact_sha256 }}
          QUALIFICATION_ROOT: ${{ runner.temp }}/phase20-qualification
        run: |
          set -euo pipefail
          experiment_root="$QUALIFICATION_ROOT/experiments"
          if [[ ! -d "$experiment_root" || -L "$experiment_root" ]]; then
            echo 'No durable native experiment evidence was produced.'
            exit 0
          fi
          while IFS= read -r -d '' symlink; do
            echo 'Refusing to archive symlinked native experiment evidence.' >&2
            exit 1
          done < <(find "$experiment_root" -type l -print0)
          archive="$RUNNER_TEMP/phase20-native-experiment.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" --directory "$QUALIFICATION_ROOT" experiments
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_key="$EVIDENCE_PREFIX/diagnostics/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/native-experiment.tar.gz"
          aws s3api put-object --bucket "$EVIDENCE_BUCKET" --key "$archive_key" \
            --body "$archive" --if-none-match '*' --server-side-encryption AES256 \
            --metadata "sha256=$archive_sha256" --content-type application/gzip >/dev/null
          echo "Private native experiment diagnostic preserved: sha256=$archive_sha256"
      - name: Verify the private review manifest readback
        id: review_readback
        if: always() && steps.qualification.outputs.qualification != ''
        shell: bash
        env:
          QUALIFICATION_PATH: ${{ steps.qualification.outputs.qualification }}
        run: |
          set -euo pipefail
          review_bucket="$(jq -er '.privateReview.s3.bucket' "$QUALIFICATION_PATH")"
          review_key="$(jq -er '.privateReview.s3.manifestKey' "$QUALIFICATION_PATH")"
          manifest_sha256="$(jq -er '.reviewManifestSha256' "$QUALIFICATION_PATH")"
          review_path="$RUNNER_TEMP/phase20-private-review.json"
          aws s3api get-object --bucket "$review_bucket" --key "$review_key" "$review_path" >/dev/null
          jq -e --arg digest "$manifest_sha256" --slurpfile pointer agent/qualification-input.json \
            -f scripts/verify-review-roster.jq "$review_path" >/dev/null
      - name: Publish only the safe qualification handoff
        id: receipt
        if: >-
          always() && steps.qualification.outputs.qualification != '' &&
          steps.review_readback.outcome == 'success'
        shell: bash
        env:
          QUALIFICATION_PATH: ${{ steps.qualification.outputs.qualification }}
        run: |
          set -euo pipefail
          # Only safe identities cross the job boundary. The protected job
          # re-reads the receipt and complete review tree from private S3.
          test -s "$QUALIFICATION_PATH"
          qualification_sha256="$(sha256sum "$QUALIFICATION_PATH" | awk '{print $1}')"
          review_manifest_sha256="$(jq -er '.reviewManifestSha256' "$QUALIFICATION_PATH")"
          qualification_key="$(jq -er '.privateReview.s3.qualificationKey' "$QUALIFICATION_PATH")"
          [[ "$qualification_sha256" =~ ^[0-9a-f]{64}$ && "$review_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$qualification_key" =~ ^agent-evaluation/phase20/[0-9a-f]{64}/[A-Za-z0-9._-]{1,120}/[0-9]+/[0-9]+/[0-9a-f]{64}/qualification\.json$ ]]
          echo "qualification_sha256=$qualification_sha256" >> "$GITHUB_OUTPUT"
          echo "review_manifest_sha256=$review_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "qualification_key=$qualification_key" >> "$GITHUB_OUTPUT"
          status="$(jq -r '.status // "unknown"' "$QUALIFICATION_PATH")"
          verdict="$(jq -r '.verdict // "unknown"' "$QUALIFICATION_PATH")"
          reason_raw="$(jq -r '.reason // empty' "$QUALIFICATION_PATH")"
          case "$status" in
            review_required|rejected|incomplete|eligible) safe_status="$status" ;;
            *) safe_status='unknown' ;;
          esac
          case "$verdict" in
            reject|incomplete|review_required|pass) safe_verdict="$verdict" ;;
            *) safe_verdict='unavailable' ;;
          esac
          safe_reason='Machine qualification did not produce an eligible review handoff.'
          safe_criterion=''
          if [[ "$reason_raw" =~ deterministic[[:space:]]+check[[:space:]]+failed:[[:space:]]*([a-z_]+)$ ]]; then
            safe_criterion="${BASH_REMATCH[1]}"
            safe_reason="Required deterministic criterion failed: $safe_criterion"
          elif [[ "$reason_raw" =~ deterministic[[:space:]]+check[[:space:]]+is[[:space:]]+incomplete:[[:space:]]*([a-z_]+)$ ]]; then
            safe_criterion="${BASH_REMATCH[1]}"
            safe_reason="Required deterministic criterion is incomplete: $safe_criterion"
          fi
          case "$safe_criterion" in
            report_structure|assessment|action|target|target_value|source_scope|as_of_time|operator_boundary) ;;
            '') ;;
            *)
              safe_criterion=''
              safe_reason='Machine qualification did not produce an eligible review handoff.'
              ;;
          esac
          review_bucket="$(jq -er '.privateReview.s3.bucket' "$QUALIFICATION_PATH")"
          review_prefix="$(jq -er '.privateReview.s3.prefix' "$QUALIFICATION_PATH")"
          [[ "$review_bucket" == "${{ env.PHASE20_EVIDENCE_BUCKET }}" ]]
          [[ "$review_prefix" =~ ^agent-evaluation/phase20/[0-9a-f]{64}/[A-Za-z0-9._-]{1,120}/[0-9]+/[0-9]+/[0-9a-f]{64}$ ]]
          console_url="$(jq -er '.privateReview.s3.consoleUrl' "$QUALIFICATION_PATH")"
          expected_console_url="https://s3.console.aws.amazon.com/s3/buckets/${review_bucket}?region=${AWS_REGION}&prefix=${review_prefix}/"
          [[ "$console_url" == "$expected_console_url" ]]
          {
            if [[ "$status" == review_required ]]; then
              echo '### Phase 20 evaluation: eligible, pending protected review'
            else
              echo '### Phase 20 evaluation: publication blocked'
            fi
            echo "- Status: $safe_status"
            echo "- Machine verdict: $safe_verdict"
            echo "- Artifact SHA-256: ${{ steps.artifact.outputs.artifact_sha256 }}"
            echo "- Qualification receipt SHA-256: $qualification_sha256"
            echo "- Review manifest SHA-256: $review_manifest_sha256"
            echo "- Private evidence (authenticated AWS Console): $console_url"
            if [[ "$status" != review_required ]]; then
              echo "- Safe failed criterion: $safe_reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed on rejected or incomplete qualification
        if: always() && steps.qualification.outputs.exit_status != '0'
        shell: bash
        env:
          QUALIFY_STATUS: ${{ steps.qualification.outputs.exit_status }}
        run: |
          set -euo pipefail
          echo "Package qualification did not produce an eligible candidate (exit=$QUALIFY_STATUS)" >&2
          exit "${QUALIFY_STATUS:-2}"

  audience-case-gate:
    name: Gate audience case (fast exact action)
    needs: route
    if: >-
      needs.route.result == 'success' &&
      needs.route.outputs.qualification_required == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/demo-deploy' &&
      needs.route.outputs.operation == 'normal'
    runs-on: ubuntu-24.04-arm
    environment: demo-evaluation
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: incident-triage-demo-audience-case-gate
      cancel-in-progress: false
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install locked agent dependencies
        run: uv sync --project agent --locked
      - name: Verify the evaluation OIDC case
        env:
          PHASE0_OIDC_CASE: allowed
          PHASE0_OIDC_ROLE_ARN: ${{ env.PHASE20_EVALUATION_ROLE_ARN }}
          PHASE0_OIDC_ENVIRONMENT: demo-evaluation
          PHASE0_DENIED_OIDC_ROLE_ARNS: ${{ env.PHASE0_DEPLOY_ROLE_ARN }},${{ env.PHASE20_PUBLISHER_ROLE_ARN }}
        run: node --test tests/phase0-oidc.test.mjs
      - name: Assume the scoped evaluation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE20_EVALUATION_ROLE_ARN }}
          role-session-name: phase20-audience-gate-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Retrieve the private native audience inputs
        id: inputs
        shell: bash
        env:
          INPUT_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          INPUT_POINTER: ${{ github.workspace }}/agent/audience-input.json
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/phase20-audience-inputs"
          mkdir -p "$input_root"
          test -s "$INPUT_POINTER"
          pointer_bucket="$(jq -er '.bucket' "$INPUT_POINTER")"
          [[ "$pointer_bucket" == "$INPUT_BUCKET" ]] || {
            echo 'audience input pointer bucket is outside the fixed evidence bucket' >&2
            exit 1
          }
          input_key="$(jq -er '.s3Key' "$INPUT_POINTER")"
          input_sha256="$(jq -er '.sha256' "$INPUT_POINTER")"
          scenario_sha256="$(jq -er '.scenarioSha256' "$INPUT_POINTER")"
          trace_sha256="$(jq -er '.traceSha256' "$INPUT_POINTER")"
          [[ "$input_key" =~ ^agent-evaluation/phase20/audience-inputs/[0-9a-f]{64}/staging\.tar\.gz$ ]]
          [[ "$input_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$scenario_sha256" =~ ^[0-9a-f]{64}$ && "$trace_sha256" =~ ^[0-9a-f]{64}$ ]]
          archive="$input_root/staging.tar.gz"
          aws s3api get-object --bucket "$INPUT_BUCKET" --key "$input_key" --checksum-mode ENABLED "$archive" >/dev/null
          printf '%s  %s\n' "$input_sha256" "$archive" | sha256sum -c -
          PYTHONPATH=agent uv run --offline --project agent --locked \
            python scripts/prepare_audience_gate.py verify \
            --archive "$archive" --pointer "$INPUT_POINTER" > "$input_root/verification.json"
          jq -e --arg scenario "$scenario_sha256" --arg trace "$trace_sha256" \
            '.scenarioSha256 == $scenario and .traceSha256 == $trace' "$input_root/verification.json" >/dev/null
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$input_sha256" >> "$GITHUB_OUTPUT"
          echo "scenario_sha256=$scenario_sha256" >> "$GITHUB_OUTPUT"
          echo "trace_sha256=$trace_sha256" >> "$GITHUB_OUTPUT"
          echo "Retrieved private audience gate archive: sha256=$input_sha256"
          echo "Pinned native inputs: scenario=$scenario_sha256 trace=$trace_sha256"
      - name: Run the same audience Strands exact-action check
        id: gate
        shell: bash
        env:
          ARCHIVE: ${{ steps.inputs.outputs.archive }}
          GATE_ROOT: ${{ runner.temp }}/phase20-audience-gate
          AGENT_OBSERVABILITY_ENABLED: 'true'
          AWS_GENAI_CONTENT_EXTRACTION_OPT_OUT: 'true'
          OTEL_TRACES_EXPORTER: otlp
          OTEL_TRACES_SAMPLER: always_on
          OTEL_PYTHON_DISTRO: aws_distro
          OTEL_PYTHON_CONFIGURATOR: aws_configurator
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://xray.us-east-1.amazonaws.com/v1/traces
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: x-aws-log-group=/aws/bedrock-agentcore/incident-triage-evaluation,x-aws-log-stream=spans
          OTEL_RESOURCE_ATTRIBUTES: service.name=IncidentTriageDemoPhase20AudienceGate,aws.log.group.names=/aws/bedrock-agentcore/incident-triage-evaluation
          OTEL_LOGS_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_SERVICE_NAME: IncidentTriageDemoPhase20AudienceGate
        run: |
          set -euo pipefail
          mkdir -p "$GATE_ROOT"
          gate_log="$GATE_ROOT/native-gate.log"
          set +e
          mkdir -p "$GATE_ROOT/inputs"
          tar -xzf "$ARCHIVE" -C "$GATE_ROOT/inputs"
          PYTHONPATH=agent:examples/live-denial uv run --offline --project agent --locked \
            opentelemetry-instrument python examples/live-denial/strands_denial.py \
            --scenario "$GATE_ROOT/inputs/staging/denial-case.json" \
            --trace "$GATE_ROOT/inputs/staging/original-trace.json" \
            --safe-output --result "$GATE_ROOT/audience-row.json" >>"$gate_log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 || "$status" -eq 1 ]]; then
            echo "Audience exact-action gate completed: exit=$status"
          else
            echo "Audience exact-action gate could not complete: exit=$status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Show the audience row in the job summary
        if: always() && steps.gate.outcome != 'skipped'
        shell: bash
        env:
          GATE_ROOT: ${{ runner.temp }}/phase20-audience-gate
          INPUT_POINTER: ${{ github.workspace }}/agent/audience-input.json
        run: |
          set -euo pipefail
          result="$GATE_ROOT/audience-row.json"
          input="$INPUT_POINTER"
          exit_code="${{ steps.gate.outputs.status }}"
          [[ "$exit_code" =~ ^[012]$ ]] || exit_code=2
          input_json='{}'
          result_json='{}'
          [[ -s "$input" ]] && input_json="$(jq -c . "$input")"
          [[ -s "$result" ]] && result_json="$(jq -c . "$result")"
          row="$(jq -cn \
            --arg commit "$GITHUB_SHA" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson exitCode "$exit_code" \
            --argjson input "$input_json" \
            --argjson result "$result_json" \
            '{
              commit: $commit,
              attempt: $attempt,
              exitCode: $exitCode,
              status: (if $exitCode == 0 then "pass" elif $exitCode == 1 then "fail" else "incomplete" end),
              blockedBy: (if $exitCode == 1 then "exact structured action mismatch" elif $exitCode == 2 then "native gate incomplete; diagnostic remains in the private runner log" else null end),
              gateKind: "native-scenario-trace",
              scenarioSha256: ($result.scenarioSha256 // $input.scenarioSha256 // null),
              traceSha256: ($result.traceSha256 // $input.traceSha256 // null),
              promptSha256: ($result.promptSha256 // null),
              evaluator: (if ($result.nativeEvaluator | type) == "object" then {name: $result.nativeEvaluator.name, score: $result.nativeEvaluator.score, testPass: $result.nativeEvaluator.testPass} elif ($result.evaluator | type) == "object" then {name: $result.evaluator.name, finding: $result.evaluator.finding} else null end),
              exactAction: ($result.exactAction // null),
              expected: ($result.expected // null),
              actual: ($result.actual // null)
            }')"
          echo "AUDIENCE_GATE_ROW=$row"
          result_field() {
            jq -r --arg side "$1" --arg field "$2" \
              'if (.[$side] | type) == "object" then (.[$side][$field] // "unavailable") | tostring else "unavailable" end' \
              <<<"$result_json"
          }
          normalize_action() {
            case "$1" in
              'Increase reserved concurrency'|'Increase memory'|'Restore inventory access'|'Other') printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_target() {
            case "$1" in
              checkout|inventory) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_value() {
            case "$1" in
              '<explanation redacted>'|'<redacted>'|unavailable) printf '%s' "$1" ;;
              [0-9]*) [[ "$1" =~ ^[0-9]+$ ]] && printf '%s' "$1" || printf 'unavailable' ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_unit() {
            case "$1" in
              MB|executions|version) printf '%s' "$1" ;;
              *) printf 'unavailable' ;;
            esac
          }
          case "$exit_code" in
            0) verdict=PASS ;;
            1) verdict=FAIL ;;
            *) verdict=INCOMPLETE ;;
          esac
          expected_action="$(normalize_action "$(result_field expected action)")"
          actual_action="$(normalize_action "$(result_field actual action)")"
          expected_target="$(normalize_target "$(result_field expected target)")"
          actual_target="$(normalize_target "$(result_field actual target)")"
          expected_value="$(normalize_value "$(result_field expected value)")"
          actual_value="$(normalize_value "$(result_field actual value)")"
          expected_unit="$(normalize_unit "$(result_field expected unit)")"
          actual_unit="$(normalize_unit "$(result_field actual unit)")"
          {
            echo '### Audience case gate'
            echo
            echo "Exact recommendation: **$verdict**"
            echo
            if [[ "$verdict" == INCOMPLETE ]]; then
              echo 'Expected vs actual action fields: unavailable (native gate incomplete; diagnostic remains in the private runner log).'
            elif [[ "$verdict" == FAIL ]]; then
              echo 'Blocked by: exact structured action mismatch.'
              echo
              echo '| Field | Expected | Actual |'
              echo '| --- | --- | --- |'
              printf '| action | `%s` | `%s` |\n' "$expected_action" "$actual_action"
              printf '| target | `%s` | `%s` |\n' "$expected_target" "$actual_target"
              printf '| value | `%s` | `%s` |\n' "$expected_value" "$actual_value"
              printf '| unit | `%s` | `%s` |\n' "$expected_unit" "$actual_unit"
            else
              echo '| Field | Expected | Actual |'
              echo '| --- | --- | --- |'
              printf '| action | `%s` | `%s` |\n' "$expected_action" "$actual_action"
              printf '| target | `%s` | `%s` |\n' "$expected_target" "$actual_target"
              printf '| value | `%s` | `%s` |\n' "$expected_value" "$actual_value"
              printf '| unit | `%s` | `%s` |\n' "$expected_unit" "$actual_unit"
            fi
            echo
            echo '<details>'
            echo '<summary>Binding and machine row</summary>'
            echo
            echo '```json'
            echo "$row"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-repaired:
    name: Publish repaired agent (protected review)
    needs: [route, evaluate-agent]
    if: >-
      needs.route.result == 'success' && needs.evaluate-agent.result == 'success' &&
      needs.route.outputs.operation == 'normal' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/demo-deploy' &&
      contains(needs.route.outputs.components, '"agent"')
    runs-on: ubuntu-24.04
    environment: repaired-publication
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: incident-triage-demo-agent
      cancel-in-progress: false
    steps:
      - name: Check out the publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download the same checked agent assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase0-agent-${{ github.sha }}
          path: .artifacts/agent
      - name: Set up Python and uv for private verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up locked uv for private verification
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - name: Install locked publisher tooling for private verification
        run: uv sync --project agent --locked
      - name: Assume the scoped evaluation role for private review readback
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE20_EVALUATION_ROLE_ARN }}
          role-session-name: phase20-private-review-${{ github.run_id }}
          role-duration-seconds: 3600
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject",
            "Resource":"arn:aws:s3:::incident-triage-demo-evidence-027224425948-us-east-1/agent-evaluation/phase20/${{ needs.evaluate-agent.outputs.artifact_sha256 }}/*"}]}
      - name: Fetch the private qualification and complete review tree
        env:
          REVIEW_BUCKET: ${{ env.PHASE20_EVIDENCE_BUCKET }}
          QUALIFICATION_KEY: ${{ needs.evaluate-agent.outputs.qualification_key }}
          EXPECTED_QUALIFICATION_SHA256: ${{ needs.evaluate-agent.outputs.qualification_sha256 }}
          EXPECTED_REVIEW_MANIFEST_SHA256: ${{ needs.evaluate-agent.outputs.review_manifest_sha256 }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.evaluate-agent.outputs.artifact_sha256 }}
          EXPECTED_EVALUATION_RUN_ID: ${{ needs.evaluate-agent.outputs.evaluation_run_id }}
          EXPECTED_EVALUATION_RUN_ATTEMPT: ${{ needs.evaluate-agent.outputs.evaluation_run_attempt }}
          EXPECTED_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_KEY" =~ ^agent-evaluation/phase20/[0-9a-f]{64}/[A-Za-z0-9._-]{1,120}/[0-9]+/[0-9]+/[0-9a-f]{64}/qualification\.json$ ]]
          [[ "$EXPECTED_QUALIFICATION_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_REVIEW_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_EVALUATION_RUN_ID" =~ ^[0-9]+$ && "$EXPECTED_EVALUATION_RUN_ATTEMPT" =~ ^[0-9]+$ && "$EXPECTED_REPOSITORY_OWNER" =~ ^[A-Za-z0-9._-]{1,120}$ ]]
          key_suffix="${QUALIFICATION_KEY#agent-evaluation/phase20/}"
          IFS='/' read -r key_artifact key_owner key_run key_attempt key_manifest key_receipt <<< "$key_suffix"
          [[ "$key_artifact" == "$EXPECTED_ARTIFACT_SHA256" && "$key_owner" == "$EXPECTED_REPOSITORY_OWNER" && "$key_run" == "$EXPECTED_EVALUATION_RUN_ID" && "$key_attempt" == "$EXPECTED_EVALUATION_RUN_ATTEMPT" && "$key_manifest" == "$EXPECTED_REVIEW_MANIFEST_SHA256" && "$key_receipt" == qualification.json ]]
          private_root="$RUNNER_TEMP/phase20-private-review"
          review_root="$private_root/review"
          mkdir -p "$review_root"
          aws s3api get-object --bucket "$REVIEW_BUCKET" --key "$QUALIFICATION_KEY" "$private_root/qualification.json" >/dev/null
          qualification_sha256="$(sha256sum "$private_root/qualification.json" | awk '{print $1}')"
          [[ "$qualification_sha256" == "$EXPECTED_QUALIFICATION_SHA256" ]] || {
            echo "private qualification digest differs from evaluated receipt" >&2
            exit 1
          }
          jq -e --arg bucket "$REVIEW_BUCKET" --arg key "$QUALIFICATION_KEY" \
            '.privateReview.s3.bucket == $bucket and .privateReview.s3.qualificationKey == $key' \
            "$private_root/qualification.json" >/dev/null
          review_prefix="${QUALIFICATION_KEY%/qualification.json}"
          PYTHONPATH=agent uv run --offline --project agent --locked python scripts/qualify-repaired.py fetch-private \
            --bucket "$REVIEW_BUCKET" --prefix "$review_prefix" --review-root "$review_root" \
            --expected-manifest "$EXPECTED_REVIEW_MANIFEST_SHA256"
          test -s "$review_root/index.json"
          index_manifest_sha256="$(jq -er '.manifestSha256' "$review_root/index.json")"
          [[ "$index_manifest_sha256" == "$EXPECTED_REVIEW_MANIFEST_SHA256" ]] || {
            echo "private review manifest differs from evaluated receipt" >&2
            exit 1
          }
      - name: Verify ZIP, qualification, branch head, and protected review before publisher credentials
        id: clearance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_QUALIFICATION_SHA256: ${{ needs.evaluate-agent.outputs.qualification_sha256 }}
          EXPECTED_EVALUATION_RUN_ID: ${{ needs.evaluate-agent.outputs.evaluation_run_id }}
          EXPECTED_EVALUATION_RUN_ATTEMPT: ${{ needs.evaluate-agent.outputs.evaluation_run_attempt }}
          ZIP_PATH: ${{ github.workspace }}/.artifacts/agent/runtime.zip
          REQUIRED_REVIEWER: ${{ env.PHASE20_REVIEWER_LOGIN }}
          REQUIRED_REVIEWER_ID: ${{ env.PHASE20_REVIEWER_ID }}
          EXPECTED_ENVIRONMENT_ID: ${{ env.PHASE20_ENVIRONMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/IncidentTriageDemoGitHubEvaluation/*) ;;
            *) echo "Unexpected private-review caller: $caller" >&2; exit 1 ;;
          esac
          test -s "$ZIP_PATH"
          QUALIFICATION="$RUNNER_TEMP/phase20-private-review/qualification.json"
          test -s "$QUALIFICATION"
          qualification_sha256="$(sha256sum "$QUALIFICATION" | awk '{print $1}')"
          [[ "$qualification_sha256" == "$EXPECTED_QUALIFICATION_SHA256" ]] || {
            echo "qualification handoff digest differs from the evaluated receipt" >&2
            exit 1
          }
          PRIVATE_REVIEW_ROOT="$RUNNER_TEMP/phase20-private-review/review"
          PRIVATE_REVIEW_INDEX="$PRIVATE_REVIEW_ROOT/index.json"
          test -s "$PRIVATE_REVIEW_INDEX"
          receipt_manifest_sha256="$(jq -er '.reviewManifestSha256' "$QUALIFICATION")"
          index_manifest_sha256="$(jq -er '.manifestSha256' "$PRIVATE_REVIEW_INDEX")"
          [[ "$index_manifest_sha256" == "$receipt_manifest_sha256" ]] || {
            echo "private review manifest differs from the protected receipt" >&2
            exit 1
          }
          PYTHONPATH=agent uv run --offline --project agent --locked python scripts/qualify-repaired.py verify-private \
            --review-root "$PRIVATE_REVIEW_ROOT" --qualification "$QUALIFICATION" \
            --current-head "$EXPECTED_HEAD" --expected-manifest "$receipt_manifest_sha256" \
            --clearance-output "$RUNNER_TEMP/phase20-private-clearance.json" >/dev/null
          artifact_sha256="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          receipt_sha256="$(jq -er '.artifact.sha256 // .artifactSha256' "$QUALIFICATION")"
          [[ "$artifact_sha256" == "$receipt_sha256" ]] || {
            echo "checked ZIP differs from the qualified artifact" >&2
            exit 1
          }
          jq -e --arg sha "$EXPECTED_HEAD" '.sourceRevision == $sha or .headSha == $sha' "$QUALIFICATION" >/dev/null
          jq -e --arg run "$EXPECTED_EVALUATION_RUN_ID" --arg attempt "$EXPECTED_EVALUATION_RUN_ATTEMPT" \
            '.github.runId == $run and .github.runAttempt == $attempt' "$QUALIFICATION" >/dev/null
          jq -e '.status == "review_required"' "$QUALIFICATION" >/dev/null

          current_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/demo-deploy" --jq .sha)"
          [[ "$current_head" == "$EXPECTED_HEAD" ]] || {
            echo "demo-deploy advanced while this candidate awaited review" >&2
            exit 1
          }
          environment_id="$(gh api "repos/$GITHUB_REPOSITORY/environments/repaired-publication" --jq .id)"
          [[ "$environment_id" == "$EXPECTED_ENVIRONMENT_ID" ]] || {
            echo "repaired-publication environment identity changed" >&2
            exit 1
          }
          approvals="$RUNNER_TEMP/phase20-approvals.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$approvals"
          manifest_sha256="$(jq -er '.reviewManifestSha256 // .manifestSha256' "$QUALIFICATION")"
          test "${#manifest_sha256}" -eq 64
          REVIEW_RUN_ID="$GITHUB_RUN_ID" REVIEW_ENVIRONMENT_ID="$environment_id" REVIEWER_ID="$REQUIRED_REVIEWER_ID" REVIEW_MANIFEST_SHA256="$manifest_sha256" APPROVALS_PATH="$approvals" \
            PYTHONPATH=agent uv run --offline --project agent --locked python - <<'PY'
          import json
          import os
          from release_gate import has_matching_approval

          history = json.loads(open(os.environ["APPROVALS_PATH"], encoding="utf-8").read())
          if not has_matching_approval(
              read_history=lambda _run_id: history,
              run_id=int(os.environ["REVIEW_RUN_ID"]),
              environment_id=int(os.environ["REVIEW_ENVIRONMENT_ID"]),
              reviewer_id=int(os.environ["REVIEWER_ID"]),
              manifest_sha256=os.environ["REVIEW_MANIFEST_SHA256"],
          ):
              raise SystemExit("no matching protected review approval")
          PY
          reviewer_login="$REQUIRED_REVIEWER"
          verified_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/demo-deploy" --jq .sha)"
          [[ "$verified_head" == "$EXPECTED_HEAD" ]] || {
            echo "demo-deploy advanced after protected review verification" >&2
            exit 1
          }
          approved="$RUNNER_TEMP/approved-qualification.json"
          jq --arg reviewer "$reviewer_login" --arg run "$GITHUB_RUN_ID" --arg head "$EXPECTED_HEAD" --arg digest "$manifest_sha256" \
            '.status = "eligible" | .humanReview = {status:"approved", environment:"repaired-publication", reviewer:$reviewer, runId:$run, headSha:$head, reviewManifestSha256:$digest} | .reviewManifestSha256 = $digest' \
            "$QUALIFICATION" > "$approved"
          echo "qualification=$approved" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "review_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "verified_head=$verified_head" >> "$GITHUB_OUTPUT"
          echo "Protected review verified for manifest $manifest_sha256 by $reviewer_login"
      - name: Assume the protected publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE20_PUBLISHER_ROLE_ARN }}
          role-session-name: phase20-publisher-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify the protected publisher identity
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/IncidentTriageDemoGitHubRepairedPublisher/*) ;;
            *) echo "Unexpected publisher caller: $caller" >&2; exit 1 ;;
          esac
          echo "Verified publisher identity: $caller"
      - name: Publish the reviewed repaired candidate
        env:
          PHASE20_QUALIFICATION_PATH: ${{ steps.clearance.outputs.qualification }}
          PHASE20_ARTIFACT_PATH: ${{ github.workspace }}/.artifacts/agent/runtime.zip
          PHASE20_SOURCE_REVISION: ${{ github.sha }}
          PHASE20_CURRENT_HEAD: ${{ steps.clearance.outputs.verified_head }}
          PHASE20_VERIFIED_HEAD: ${{ steps.clearance.outputs.verified_head }}
          PHASE20_ARTIFACT_SHA256: ${{ steps.clearance.outputs.artifact_sha256 }}
          PHASE20_REVIEW_MANIFEST_SHA256: ${{ steps.clearance.outputs.review_manifest_sha256 }}
        run: uv run --offline --project agent --locked python scripts/publish-repaired.py

  reconcile-agent:
    name: Reconcile agent stack after protected publication
    needs: [route, check-agent, publish-repaired]
    if: >-
      always() && !cancelled() && needs.route.result == 'success' &&
      needs.check-agent.result == 'success' && needs.publish-repaired.result == 'success' &&
      needs.route.outputs.reconcile_after_gate == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/demo-deploy'
    runs-on: ubuntu-24.04
    environment: demo-infrastructure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: incident-triage-demo-agent
      cancel-in-progress: false
    steps:
      - name: Check out stack reconciler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download the same checked agent assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase0-agent-${{ github.sha }}
          path: .artifacts/agent
      - name: Verify checked stack assembly
        run: |
          test -s .artifacts/agent/cdk/manifest.json
          test -s .artifacts/agent/runtime.zip
      - name: Set up Node.js for stack reconciliation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned deploy CLI
        run: npm ci --ignore-scripts
      - name: Verify the allowed OIDC case
        env:
          PHASE0_OIDC_CASE: allowed
          PHASE0_OIDC_ROLE_ARN: ${{ env.PHASE0_DEPLOY_ROLE_ARN }}
          PHASE0_OIDC_ENVIRONMENT: demo-infrastructure
        run: node --test tests/phase0-oidc.test.mjs
      - name: Assume the GitHub deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PHASE0_DEPLOY_ROLE_ARN }}
          role-session-name: phase20-agent-reconcile-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify the GitHub deployment identity
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          case "$caller" in
            arn:aws:sts::027224425948:assumed-role/IncidentTriageDemoGitHubDeploy/*) ;;
            *) echo 'Unexpected deployment caller' >&2; exit 1 ;;
          esac
      - name: Set up locked Python tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - name: Install locked agent tooling
        run: uv sync --project agent --locked
      - name: Reconcile stack and adapter without a Runtime asset upload
        env:
          PHASE20_AGENT_INFRASTRUCTURE_ONLY: 'true'
        run: bash scripts/deploy-agent.sh
